<style>
/* Layout: an atlas of stained slides. Home is a grid of subject "slides"; a subject opens a two-pane reader (note index | note plate); quizzes run one question per screen. Subject colors are histology stains. */
:root{
  --bg:#f1f3f6; --surface:#ffffff; --ink:#141c25; --muted:#586574; --line:#d6dce4; --soft:#e7e9f3;
  --accent:#3f3796; --accent-ink:#ffffff; --good:#1d7a4c; --bad:#b3324c;
  --s-hema:#4b3a9c; --s-eosin:#c03f77; --s-lfb:#1f6db0; --s-silver:#98681c; --s-cresyl:#7c3a97; --s-safranin:#bd3a2b; --s-fast:#24876a;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1319; --surface:#161d25; --ink:#e5eaf0; --muted:#98a4b2; --line:#29333f; --soft:#20263a;
  --accent:#a8a1ff; --accent-ink:#15122f; --good:#56c58d; --bad:#f07c91;
  --s-hema:#9c8fff; --s-eosin:#f07fae; --s-lfb:#6ab2f0; --s-silver:#dba653; --s-cresyl:#c78ce2; --s-safranin:#f08470; --s-fast:#5ccfaa;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1319; --surface:#161d25; --ink:#e5eaf0; --muted:#98a4b2; --line:#29333f; --soft:#20263a;
  --accent:#a8a1ff; --accent-ink:#15122f; --good:#56c58d; --bad:#f07c91;
  --s-hema:#9c8fff; --s-eosin:#f07fae; --s-lfb:#6ab2f0; --s-silver:#dba653; --s-cresyl:#c78ce2; --s-safranin:#f08470; --s-fast:#5ccfaa;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1120px;margin:0 auto}
a{color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
.mono{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.04em;color:var(--muted)}
.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11.5px}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:8px 16px;font-weight:500;font-size:14.5px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.btn.small{padding:5px 12px;font-size:13.5px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:20px 8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:19px;text-decoration:none}
.mark{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--s-eosin) 0 30%,transparent 31%),radial-gradient(circle at 65% 60%,var(--s-hema) 0 38%,transparent 39%),var(--soft);border:1.5px solid var(--ink)}
.back{text-decoration:none;color:var(--muted);font-weight:500}
.back:hover{color:var(--ink)}

/* home */
.hero{padding-block:28px 24px;display:grid;gap:8px}
.hero h1{font-size:clamp(30px,5vw,46px);font-weight:750;letter-spacing:-.02em}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.card{--c:var(--accent);position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s}
.card:hover{transform:translateY(-4px);border-color:var(--c);box-shadow:0 14px 30px -18px var(--c)}
.card-main{display:grid;gap:6px;text-decoration:none;padding:0 0 4px;flex:1}
.slide{height:128px;position:relative;overflow:hidden;background:color-mix(in srgb,var(--c) 10%,var(--surface));border-bottom:1px solid var(--line)}
.blob{position:absolute;right:18px;top:16px;width:96px;height:96px;border-radius:46% 54% 50% 50%/55% 45% 55% 45%;
  background:radial-gradient(circle at 30% 35%,color-mix(in srgb,var(--c) 85%,#000) 0 6%,transparent 7%),
    radial-gradient(circle at 62% 58%,color-mix(in srgb,var(--c) 85%,#000) 0 5%,transparent 6%),
    radial-gradient(circle at 45% 75%,color-mix(in srgb,var(--c) 85%,#000) 0 4%,transparent 5%),
    radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--c) 55%,var(--surface)) 0 60%,color-mix(in srgb,var(--c) 30%,var(--surface)) 61% 100%);
  transition:transform .4s ease}
.card:hover .blob{transform:rotate(18deg) scale(1.08)}
.card h2{font-size:22px;font-weight:700;padding:14px 18px 0}
.card p{margin:0;padding:0 18px;color:var(--muted);font-size:14.5px}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 18px 16px}
.card.add{align-items:center;justify-content:center;min-height:240px;border-style:dashed;background:transparent;cursor:pointer;color:var(--muted);font-weight:500;gap:8px}
.card.add:hover{color:var(--ink);border-color:var(--ink);box-shadow:none}
.plus{width:44px;height:44px;border-radius:50%;border:1.5px dashed currentColor;display:grid;place-items:center;font-size:24px;line-height:1}

/* subject */
.subj-head{--c:var(--accent);display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-block:18px 18px;border-bottom:3px solid var(--c)}
.subj-head h1{font-size:clamp(28px,4.5vw,40px);font-weight:750;letter-spacing:-.02em}
.subj-head p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.subj-head .eyebrow{color:var(--c)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;padding-block:14px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{background:var(--soft);color:var(--ink)}
.tab .n{font-family:var(--f-mono);font-size:12px;margin-left:4px}
.reader{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;align-items:start}
.index{position:sticky;top:12px;display:grid;gap:10px;min-width:0}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px}
.index ol{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-height:min(60vh,560px);overflow:auto}
.index li button{width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:8px 10px;cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:6px;align-items:baseline}
.index li button:hover{background:var(--soft)}
.index li button[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--c,var(--accent));font-weight:600}
.index .num{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.plate{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,3.5vw,36px);min-width:0}
.plate-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px}
.plate h2{font-size:clamp(24px,3.4vw,32px);font-weight:700;letter-spacing:-.01em}
.prose{max-width:68ch;overflow-wrap:anywhere}
.prose h3{font-size:20px;margin:26px 0 6px}
.prose h4{font-family:var(--f-body);font-size:16px;font-weight:600;margin:20px 0 4px}
.prose p{margin:0 0 12px}
.prose ul,.prose ol{margin:0 0 12px;padding-left:22px}
.prose li{margin:3px 0}
.prose li::marker{color:var(--c,var(--accent))}
.prose code{font-family:var(--f-mono);font-size:.88em;background:var(--soft);padding:1px 5px;border-radius:5px}
.prose blockquote{margin:14px 0;padding:10px 14px;border-left:3px solid var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 9%,var(--surface));border-radius:0 10px 10px 0}
.prose blockquote::before{content:"High-yield";display:block;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--c,var(--accent));margin-bottom:2px}
.prose blockquote p:last-child{margin:0}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:32px 22px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.empty h3{color:var(--ink);font-size:20px}

/* question bank */
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.qitem{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:start}
.qitem .qp{font-weight:500}
.qitem .qa{font-size:14px;color:var(--muted)}
.qitem .qa b{color:var(--good);font-weight:600}

/* quiz */
.quiz{max-width:760px;margin:0 auto;display:grid;gap:18px;padding-top:12px}
.progress{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--c,var(--accent));transition:width .3s ease}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,3.5vw,32px);display:grid;gap:16px}
.qcard h2{font-size:clamp(20px,3vw,25px);font-weight:650;letter-spacing:-.005em}
.choices{display:grid;gap:8px}
.choice{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice .k{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;background:var(--soft)}
.choice:disabled{cursor:default}
.choice.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.choice.right .k{background:var(--good);color:var(--surface)}
.choice.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.choice.wrong .k{background:var(--bad);color:var(--surface)}
.verdict{border-radius:12px;padding:12px 16px;background:var(--soft)}
.verdict strong{display:block;margin-bottom:2px}
.verdict.ok strong{color:var(--good)} .verdict.no strong{color:var(--bad)}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.score{display:grid;gap:4px;justify-items:center;text-align:center;padding-block:10px}
.score .big{font-family:var(--f-display);font-size:clamp(52px,10vw,84px);font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.missed{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.missed li{border-left:3px solid var(--bad);padding:6px 12px;background:var(--surface);border-radius:0 10px 10px 0}
.missed .ans{color:var(--good);font-weight:600}

/* sheet (editor) */
#sheet{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--ink) 40%,transparent);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#sheet[hidden]{display:none!important}
.sheet-panel{width:min(720px,100%);max-height:100%;overflow:auto;background:var(--surface);border-radius:18px;border:1px solid var(--line);padding:22px;display:grid;gap:14px}
.sheet-panel h2{font-size:22px}
.field{display:grid;gap:5px}
.field label,.field .lbl{font-weight:600;font-size:14px}
.field .hint{font-size:13px;color:var(--muted)}
.field input[type=text],.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px}
.field textarea{min-height:260px;resize:vertical;font-family:var(--f-mono);font-size:14px;line-height:1.55}
.field textarea.short{min-height:80px;font-family:var(--f-body);font-size:15px}
.chrow{display:grid;grid-template-columns:auto 26px 1fr;gap:8px;align-items:center}
.chrow .k{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{width:34px;height:34px;border-radius:50%;background:var(--c);cursor:pointer;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches input:checked+label{box-shadow:0 0 0 2px var(--ink)}
.swatches input:focus-visible+label{outline:2px solid var(--accent);outline-offset:3px}
.form-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:6px}
.form-foot .right{display:flex;gap:8px;margin-left:auto}
.err{color:var(--bad);font-size:14px;margin:0}

.notice{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--soft);font-size:14px;color:var(--muted)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:36px;padding-top:16px;border-top:1px solid var(--line)}
.tools .mono{margin-right:auto}
.live{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:22px}
.live.one{grid-template-columns:minmax(0,1fr)}
.live-col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.live-col h3{font-size:17px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.lb,.feed{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.lb li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line)}
.lb li:last-child,.feed li:last-child{border-bottom:0}
.lb .rank{font-family:var(--f-mono);color:var(--muted);font-size:13px}
.lb li:first-child .rank{color:var(--c,var(--accent));font-weight:600}
.lb .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.feed li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.feed li .mono{white-space:nowrap;font-size:12px}
.muted{color:var(--muted);margin:0;font-size:14.5px}
.qcard .field input{width:100%;max-width:340px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who-chip{display:flex;align-items:center;gap:8px}
.me{position:relative}
.me>summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;padding:3px 10px 3px 3px;border:1px solid transparent;border-radius:999px;user-select:none}
.me>summary::-webkit-details-marker{display:none}
.me>summary:hover,.me[open]>summary{border-color:var(--line);background:var(--surface)}
.me>summary .chev{font-size:11px;color:var(--muted);transition:transform .2s}
.me[open]>summary .chev{transform:rotate(180deg)}
.me .initial{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px}
.me-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:50;min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px -18px rgba(0,0,0,.35);padding:6px;display:grid;gap:2px;animation:menuin .16s ease-out}
@keyframes menuin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (max-width:860px){
  .me-menu{position:fixed;left:12px;right:12px;top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));min-width:0;max-height:80vh;overflow:auto;border-radius:20px;padding:8px;
    box-shadow:0 0 0 100vmax rgba(0,0,0,.45),0 20px 50px -20px rgba(0,0,0,.6);animation:sheetup .22s cubic-bezier(.2,.9,.3,1)}
  .me-menu::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line);margin:2px auto 8px}
  .me-menu .who{white-space:normal;overflow-wrap:anywhere}
  .me-menu a,.me-menu button{padding:13px 12px;font-size:16px}
  .me>summary .who-nm{max-width:12ch}
}
@keyframes sheetup{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.me-menu .who{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-menu .who b{display:block;color:var(--ink);font-size:14.5px}
.me-menu a,.me-menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:9px;border:0;background:none;font:inherit;font-size:14.5px;color:var(--ink);text-decoration:none;cursor:pointer}
.me-menu a:hover,.me-menu button:hover{background:var(--soft)}
.me-menu .heart{color:#e5484d}
.me-menu .sup{font-weight:600}
.support{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:28px;align-items:start;margin-top:8px}
.support .why{display:grid;gap:12px;color:var(--muted);max-width:56ch}
.support .why p{margin:0}
.support .why ul{margin:0;padding-left:20px;display:grid;gap:4px}
.qr-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;justify-items:center;text-align:center}
.qr-card img{width:100%;max-width:280px;border-radius:10px;background:#fff}
.qr-empty{width:100%;max-width:280px;aspect-ratio:1;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:14px;padding:20px}

/* pass 2 */

.hero{grid-template-columns:minmax(0,1fr)}.urgents{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;min-width:0}.urgent .when{flex:none}.urgent{min-width:0}.urgents .urgent{margin-top:0}

.viewer-bar .vb-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.suggest-fab .lbl{display:none}.suggest-fab{padding:10px;width:44px;height:44px;justify-content:center;opacity:.85}.suggest-fab:hover{opacity:1}
body:has(.suggest-fab:not([hidden])){padding-bottom:64px}

/* download prep popup (first download per visit) */
.prep{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;z-index:70;width:min(420px,calc(100vw - 32px));
  background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px 14px;box-shadow:0 24px 50px -20px rgba(0,0,0,.55);display:grid;gap:8px;transition:transform .28s cubic-bezier(.2,.9,.3,1.2),opacity .2s}
.prep.in{transform:translate(-50%,0);opacity:1}
.prep .row{display:flex;align-items:center;gap:10px}
.prep .ic{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 18%,var(--surface));color:var(--accent);font-size:15px}
.prep b{font-weight:600;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.prep .skip{background:none;border:0;padding:4px 6px;font:500 13px/1 var(--f-body);color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px;border-radius:6px}
.prep .skip:hover{color:var(--ink)}
.prep .x{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:18px;line-height:1;cursor:pointer;display:grid;place-items:center}
.prep .x:hover{color:var(--ink)}
.prep .save{justify-self:stretch;text-align:center;justify-content:center}
.prep .bar{height:4px;border-radius:4px;background:var(--soft);overflow:hidden}
.prep .bar i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transform:scaleX(0);animation:prepbar var(--dur,3s) linear forwards}
@keyframes prepbar{to{transform:scaleX(1)}}
.prep p{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
.prep p a{color:var(--accent);font-weight:500;text-decoration:none}.prep p a:hover{text-decoration:underline}
@media (prefers-reduced-motion: reduce){.prep{transition:none}}

/* ===== upgrades 3-6 ===== */
/* 3 · subject colours in Coming up */
.un .bd{border-left:2px solid var(--sc,var(--line));padding-left:10px}
.un .su{display:inline-flex;align-items:center;gap:6px;color:var(--sc,var(--muted));font-weight:500}
.un .su::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sc,var(--muted));flex:none}
/* 4 · subject cards */
.subj{position:relative;display:flex;flex-direction:column;gap:12px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;transition:transform .2s,border-color .2s,box-shadow .2s}
.subj:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 12px 32px -14px var(--c)}
.sj-head{display:flex;align-items:center;gap:12px}
.subj-ico{width:46px;height:46px;flex:none;border-radius:13px;display:grid;place-items:center;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 70%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent);transition:transform .3s}
.subj:hover .subj-ico{transform:rotate(-6deg) scale(1.05)}
.subj-ico svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.subj-name{margin:0;font-family:var(--f-display);font-size:19px;font-weight:700;line-height:1.2}
.subj-count{font:500 11.5px/1.4 var(--f-mono);color:var(--muted);letter-spacing:.03em}
.subj .subj-name .new-pill{position:static;margin-left:4px;vertical-align:3px}
.subj-chips{display:flex;flex-wrap:wrap;gap:6px}
.subj-chips span{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.subj-chips span.more{border-style:dashed}
.subj-prog{display:flex;align-items:center;gap:4px}
.subj-prog i{width:9px;height:9px;border-radius:3px;border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent)}
.subj-prog i.on{background:var(--c);border-color:var(--c)}
.subj-prog b{font:500 11px/1 var(--f-mono);color:var(--muted);margin-left:6px}
.subj-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:10px;border-top:1px dashed var(--line);font:500 11.5px/1.3 var(--f-mono);color:var(--muted)}
.subj-new{color:var(--c);font-weight:600}
.subj-quiz{color:var(--c);text-decoration:none;font-weight:600}
/* 5 · countdown chips */
.urgent{gap:10px;font-size:13.5px;border-color:var(--line);background:var(--surface)}
.urgent .cd-ico{color:var(--muted)}
.urgent .cd-time{font:500 12px/1 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.urgent .cd-bar{display:none;width:42px;height:3px;border-radius:2px;background:var(--soft);overflow:hidden;flex:none}
.urgent .cd-fill{display:block;height:100%;width:0;background:var(--bad);transition:width 1s linear}
.urgent.hot{border-color:color-mix(in srgb,var(--bad) 55%,transparent);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.urgent.hot .cd-time,.urgent.hot .cd-ico{color:var(--bad)}
.urgent.hot .cd-bar{display:inline-block}
/* 6 · note cards */
.nc{--c:var(--accent);position:relative;display:flex;gap:14px;padding:12px;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:14px;transition:transform .2s,border-color .2s,box-shadow .2s}
.nc:hover,.nc:focus-visible{transform:translateY(-2px);border-color:var(--c);box-shadow:0 12px 26px -20px var(--c);outline:none}
.nc-thumb{width:62px;height:82px;flex:none;border-radius:7px;border:1px solid var(--line);overflow:hidden;background:#fff;display:block}
.nc-thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.nc-stack{position:relative;overflow:visible;border:0;background:none}
.nc-stack img,.nc-stack i{position:absolute;width:100%;height:100%;object-fit:cover;object-position:top;border-radius:7px;border:1px solid var(--line);background:#fff;display:block}
.nc-stack>:first-child{transform:translate(6px,-5px) rotate(4deg);opacity:.85}
.nc-set .nc-thumb{margin-right:6px}
.pick-q{margin:-4px 0 0;color:var(--muted)}
.pick-list{display:grid;gap:10px}
.pick-opt{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid var(--line);border-radius:14px;color:inherit;text-decoration:none;background:var(--surface);transition:border-color .2s,transform .2s}
.pick-opt:hover,.pick-opt:focus-visible{border-color:var(--c);transform:translateY(-1px);outline:none}
.pick-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pick-txt b{font-family:var(--f-display);font-size:16px}
.pick-go{font:600 12.5px/1 var(--f-mono);color:var(--c);white-space:nowrap}
.nc-thumb.blank{background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.nc-body{flex:1;min-width:0;display:flex;flex-direction:column}
.nc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.nc-name{margin:0;font-family:var(--f-display);font-size:16px;font-weight:700;line-height:1.25;min-width:0}
.nc-new{display:inline-block;margin-left:6px;vertical-align:2px;font:600 10px/1 var(--f-mono);padding:3px 7px;border-radius:999px;background:color-mix(in srgb,#8e4ec6 18%,transparent);color:#a879e0;text-transform:uppercase;letter-spacing:.05em}
.nc-src{margin:3px 0 0;font-size:12.5px;color:var(--muted);line-height:1.4}
.nc-meta{margin-top:6px;font:500 11px/1.4 var(--f-mono);color:var(--muted)}
.nc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.nc-hint{font-size:11.5px;color:var(--c);font-weight:500}
.nc-acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nc-acts .btn{min-height:0;height:30px;padding:0 12px;font:500 12.5px/1 var(--f-mono);gap:6px}
.nc-acts .rev{height:30px;padding:0 10px;font-size:12px}
@media (hover:none){.nc-hint::before{content:"Tap to preview"}}
@media (hover:hover){.nc-hint::before{content:"Click to preview"}}
@media (prefers-reduced-motion: reduce){.subj:hover,.nc:hover,.subj:hover .subj-ico{transform:none}}

/* subject icon pop on tap */
.subj-ico{position:relative;-webkit-tap-highlight-color:transparent}
.subj-ico>svg{position:relative;z-index:1}
.subj-ico.pop{animation:ico-pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes ico-pop{0%{transform:scale(1)}25%{transform:scale(.82)}60%{transform:scale(1.16)}100%{transform:scale(1)}}
.ico-ring{position:absolute;inset:0;border-radius:inherit;border:2px solid var(--c);pointer-events:none;animation:ico-ring .6s ease-out forwards}
@keyframes ico-ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.9);opacity:0}}
.ico-spark{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--c);pointer-events:none;animation:ico-spark .6s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes ico-spark{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.subj-ico.pop[data-anim="brain"]>svg{animation:ico-think .9s ease .15s}
@keyframes ico-think{0%,100%{filter:none}40%{filter:drop-shadow(0 0 6px var(--c)) drop-shadow(0 0 12px var(--c))}}
.subj-ico.pop[data-anim="neuron"]>svg{animation:ico-fire .55s cubic-bezier(.4,0,.2,1) .1s}
@keyframes ico-fire{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.subj-ico.pop[data-anim="bone"]>svg{animation:ico-wiggle .6s ease .1s}
.subj-ico.pop[data-anim="heart"]>svg{animation:ico-beat .8s ease .1s}
@keyframes ico-beat{0%,100%{transform:scale(1)}15%{transform:scale(1.22)}30%{transform:scale(.95)}45%{transform:scale(1.15)}60%{transform:scale(1)}}
.subj-ico.pop[data-anim="sprout"]>svg{animation:ico-grow .7s cubic-bezier(.3,1.6,.5,1) .1s;transform-origin:50% 90%}
@keyframes ico-grow{0%{transform:scaleY(.35) scaleX(.8)}100%{transform:none}}
@keyframes ico-wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-22deg)}40%{transform:rotate(18deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(5deg)}}
@media (prefers-reduced-motion: reduce){.subj-ico.pop,.subj-ico.pop>svg{animation:none!important}.ico-ring,.ico-spark{display:none}}

/* ===== 8 · my progress: streaks, heatmap, badges ===== */
.ap-overlay{position:fixed;inset:0;z-index:9000;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,7,12,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .25s}
.ap-overlay.on{opacity:1}
.ap-sheet{width:min(560px,100%);max-height:88vh;overflow:auto;padding:22px 20px calc(28px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0;background:var(--surface);color:var(--ink);border:1px solid var(--line);transform:translateY(30px);transition:transform .35s cubic-bezier(.3,1.2,.5,1)}
.ap-overlay.on .ap-sheet{transform:none}
@media (min-width:640px){.ap-overlay{align-items:center}.ap-sheet{border-radius:22px}}
.ap-close{float:right;width:34px;height:34px;border-radius:50%;cursor:pointer;border:1px solid var(--line);background:none;color:var(--muted);font-size:18px;line-height:1}
.ap-me{display:flex;align-items:center;gap:14px}
.ap-av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:700;color:#fff;background:linear-gradient(135deg,#a99cff,#6fb3f2 55%,#f07fa6);overflow:hidden;flex:none}
.ap-av img{width:100%;height:100%;object-fit:cover}
.ap-name{margin:0;font-family:var(--f-display);font-size:20px;font-weight:700}
.ap-since{margin-top:3px;font:12px var(--f-mono);color:var(--muted)}
.ap-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.ap-box{padding:14px;border-radius:16px;background:var(--bg);border:1px solid var(--line)}
.ap-lbl{font:11px var(--f-mono);letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.ap-streak{display:flex;align-items:center;gap:10px;margin-top:6px}
.ap-flame{display:inline-block;font-size:30px;transform-origin:50% 90%;animation:ap-flame 1.6s ease-in-out infinite}
.ap-flame.cold{filter:grayscale(1);opacity:.4;animation:none}
@keyframes ap-flame{50%{transform:scale(1.08) rotate(-4deg)}}
.ap-big{font-size:30px;font-weight:800;line-height:1}
.ap-small{margin-top:2px;font-size:12px;color:var(--muted)}
.ap-wk,.ap-heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.ap-wk{font:9px var(--f-mono);color:var(--muted);text-align:center}
.ap-heat span{aspect-ratio:1;border-radius:4px;background:var(--soft)}
.ap-heat span.on{background:var(--accent)}
.ap-heat span.today{outline:1.5px solid var(--accent);outline-offset:1px}
.ap-heat span.future{background:none}
.ap-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.ap-stats b{display:block;margin-top:4px;font-size:20px;font-weight:700}
.ap-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.ap-h h3{margin:0;font-size:16px}.ap-h span{font:12px var(--f-mono);color:var(--muted)}
.ap-badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.ap-b{padding:12px 6px 10px;text-align:center;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.ap-bi{position:relative;width:50px;height:50px;margin:0 auto 8px;overflow:hidden;display:grid;place-items:center;font-size:24px;border-radius:15px;background:var(--soft);border:1px solid var(--line);filter:grayscale(1);opacity:.45}
.ap-b.on .ap-bi{filter:none;opacity:1;border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.ap-bi::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg)}
.ap-b.on .ap-bi::after{animation:ap-shine 3.5s ease-in-out infinite}
@keyframes ap-shine{0%,70%{left:-80%}100%{left:130%}}
.ap-bn{font-size:12px;font-weight:600}.ap-b:not(.on) .ap-bn{color:var(--muted)}
.ap-bd{margin-top:3px;font-size:10.5px;line-height:1.35;color:var(--muted)}
.ap-bar{height:3px;margin:8px 8px 0;overflow:hidden;border-radius:2px;background:var(--soft)}
.ap-bar i{display:block;height:100%;background:var(--accent)}
.ap-note{margin:16px 0 0;font-size:12px;color:var(--muted);text-align:center}
.ap-toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:9500;pointer-events:none;display:flex;align-items:center;gap:10px;padding:10px 16px 10px 10px;border-radius:999px;background:var(--surface);color:var(--ink);border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);box-shadow:0 12px 30px rgba(0,0,0,.4);font-size:14px;transform:translate(-50%,20px) scale(.9);opacity:0;transition:transform .35s cubic-bezier(.3,1.4,.5,1),opacity .35s}
.ap-toast.on{transform:translate(-50%,0) scale(1);opacity:1}
.ap-ti{width:34px;height:34px;flex:none;display:grid;place-items:center;font-size:18px;border-radius:50%;background:color-mix(in srgb,var(--accent) 18%,transparent)}
.ap-toast.on .ap-ti{animation:ap-pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes ap-pop{0%{transform:scale(.4) rotate(-20deg)}100%{transform:none}}
.ap-toast small{display:block;font-size:11px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.ap-flame,.ap-b.on .ap-bi::after,.ap-toast.on .ap-ti{animation:none}}
/* ===== 9 · here now ===== */
.here{display:flex;align-items:center;gap:8px;height:0;margin-top:0;overflow:hidden;opacity:0;font-size:12px;color:var(--muted);transition:height .3s,margin .3s,opacity .3s}

.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px}

/* here now on home subject cards */
.here-subj.on{height:20px;margin-top:6px}
.subj-ico.ico-here::before{content:"";position:absolute;top:-4px;right:-4px;z-index:2;width:12px;height:12px;border-radius:50%;background:#3fb950;border:2px solid var(--surface);box-shadow:0 0 0 0 rgba(63,185,80,.6);animation:ico-live 2s infinite}
@keyframes ico-live{70%{box-shadow:0 0 0 7px rgba(63,185,80,0)}100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}}
@media (prefers-reduced-motion: reduce){.subj-ico.ico-here::before{animation:none}}

.app-tag{display:inline-flex;align-items:center;gap:3px;margin-left:8px;padding:1px 8px;border-radius:999px;font:11px var(--f-mono);white-space:nowrap;color:#3fb950;border:1px solid color-mix(in srgb,#3fb950 45%,transparent);background:color-mix(in srgb,#3fb950 10%,transparent)}
.prog-tag{color:#f0997b;border-color:color-mix(in srgb,#f0997b 45%,transparent);background:color-mix(in srgb,#f0997b 10%,transparent)}

/* active status */
.sw-row{display:flex;align-items:center;white-space:nowrap}
.mini-sw{position:relative;width:30px;height:18px;margin-left:auto;border-radius:999px;background:var(--soft);flex:none;transition:background .25s}
.mini-sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .25s}
.sw-row[aria-checked=true] .mini-sw{background:#3fb950}
.sw-row[aria-checked=true] .mini-sw::after{transform:translateX(12px)}
.who-hid{margin-left:6px;padding:0 6px;border-radius:999px;font:10px var(--f-mono);color:var(--muted);border:1px solid var(--line)}
.who-more{color:var(--muted)}
.dot.off{background:var(--muted)!important;box-shadow:none!important;animation:none!important}
.who-tip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:0!important;padding-top:12px}

/* profiles + nudges */
.who-tap{cursor:pointer;border-radius:10px;transition:background .15s}
.who-tap:hover,.who-tap:focus-visible{background:var(--soft);outline:none}
.who-go{color:var(--muted);font-size:18px;line-height:1;margin-left:4px}
.pf{position:relative;text-align:center;padding:6px 0 10px}
.pf-back{position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--muted);font-size:20px;cursor:pointer}
.pf-av{position:relative;width:84px;height:84px;margin:4px auto 12px;border-radius:50%;display:grid;place-items:center;font-size:32px;font-weight:700;color:#fff;background:var(--hc)}
.pf-av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.pf-dot{position:absolute;right:4px;bottom:4px;width:16px;height:16px;border-radius:50%;background:#3fb950;border:3px solid var(--surface)}
.pf-name{margin:0;font-size:22px}
.pf-doing{margin:4px 0 0;color:var(--muted);font-size:14px}
.pf-stats{display:flex;justify-content:center;gap:12px;margin:16px 0 0}
.pf-stats div{min-width:110px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg)}
.pf-stats b{display:block;font-size:18px}.pf-stats span{font-size:12px;color:var(--muted)}
.pf-nudge{margin-top:18px;min-width:160px;font-size:16px;gap:8px}
.pf-nudge.sent .pf-wave{display:inline-block;animation:poke .5s ease 2}
.pf-nudge.shake{animation:nudge-shake .4s}
.pf-note{margin:10px 0 0;font-size:12px;color:var(--muted)}
@keyframes poke{0%,100%{transform:translateX(0)}40%{transform:translateX(7px) scale(1.1)}60%{transform:translateX(7px) scale(1.1)}}
@keyframes wave{0%,100%{transform:rotate(0)}20%{transform:rotate(-25deg)}40%{transform:rotate(20deg)}60%{transform:rotate(-15deg)}80%{transform:rotate(10deg)}}
@keyframes nudge-shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
body.nudged #app{animation:nudge-shake .55s}
.nudge-pop{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));z-index:9600;display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border-radius:999px;background:var(--surface);color:var(--ink);border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 14px 34px rgba(0,0,0,.45);font-size:15px;transform:translate(-50%,-140%);opacity:0;transition:transform .4s cubic-bezier(.3,1.4,.5,1),opacity .3s;max-width:calc(100vw - 32px)}
.nudge-pop.on{transform:translate(-50%,0);opacity:1}
.nudge-pop{width:max-content}.nudge-pop>span:nth-child(2){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nudge-hand{font-size:22px;display:inline-block;transform-origin:70% 80%}
.nudge-pop.on .nudge-hand{animation:poke .45s ease 4}
@media (prefers-reduced-motion: reduce){body.nudged #app,.nudge-pop.on .nudge-hand,.pf-nudge.sent .pf-wave,.pf-nudge.shake{animation:none}}
.ask-bell{font-size:40px;line-height:1;display:block;margin-bottom:6px;transform-origin:50% 0;animation:bellRing 1.4s ease-in-out 2}
@keyframes bellRing{0%,60%,100%{transform:rotate(0)}10%{transform:rotate(16deg)}20%{transform:rotate(-14deg)}30%{transform:rotate(10deg)}40%{transform:rotate(-8deg)}50%{transform:rotate(4deg)}}
@media (prefers-reduced-motion: reduce){.ask-bell{animation:none}}
/* ---------- Lucky Roll ---------- */
.lr-die-num{font:800 22px var(--f-display);fill:#fff;paint-order:stroke;stroke:#0000004d;stroke-width:2.2px;letter-spacing:-.02em}
@keyframes lrBob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-6deg)}}
#lr-ov{position:fixed;inset:0;z-index:200;pointer-events:none;overflow:hidden;visibility:hidden}
#lr-ov.lr-on,#lr-ov.lr-busy{visibility:visible}
.lr-ov-dim{position:absolute;inset:0;background:rgba(5,6,12,.72);backdrop-filter:blur(8px);opacity:0;transition:opacity .45s}
#lr-ov.lr-on .lr-ov-dim{opacity:1}
.lr-big-die{opacity:0;position:fixed;left:0;top:0;width:58px;height:58px;transform-origin:0 0;transition:transform .55s cubic-bezier(.2,.9,.25,1);z-index:2;filter:drop-shadow(0 18px 30px rgba(0,0,0,.6))}
.lr-big-die svg{width:100%;height:100%;overflow:visible}
.lr-big-die .lr-spin{width:100%;height:100%}
.lr-big-die.lr-rolling .lr-spin{animation:lrTumble 1.2s cubic-bezier(.3,.7,.4,1)}
@keyframes lrTumble{0%{transform:rotate(0) scale(1)}25%{transform:rotate(260deg) scale(.86) translateY(-10px)}55%{transform:rotate(620deg) scale(1.06)}80%{transform:rotate(700deg) scale(.98)}100%{transform:rotate(720deg) scale(1)}}
.lr-big-die.lr-landed .lr-spin{animation:lrLand .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes lrLand{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.lr-rays{position:absolute;left:50%;top:44%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;opacity:0;background:repeating-conic-gradient(from 0deg,var(--rc) 0 6deg,transparent 6deg 20deg);-webkit-mask:radial-gradient(circle,#000 0 18%,transparent 62%);mask:radial-gradient(circle,#000 0 18%,transparent 62%);z-index:1}
.lr-rays.lr-go{animation:lrRays 2.6s ease-out forwards}
.lr-rays.lr-rainbow{background:repeating-conic-gradient(from 0deg,#ff7eb3 0 6deg,transparent 6deg 14deg,#ffd36e 14deg 20deg,transparent 20deg 28deg,#7affc1 28deg 34deg,transparent 34deg 42deg,#6ec8ff 42deg 48deg,transparent 48deg 56deg,#c58bff 56deg 62deg,transparent 62deg 72deg)}
@keyframes lrRays{0%{opacity:0;transform:rotate(0) scale(.4)}20%{opacity:.9}100%{opacity:0;transform:rotate(80deg) scale(1.1)}}
.lr-ring{position:absolute;left:50%;top:44%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid var(--rc);opacity:0;z-index:1}
.lr-ring.lr-go{animation:lrRing .9s ease-out forwards}
.lr-ring.lr-go.lr-r2{animation-delay:.18s}
@keyframes lrRing{0%{opacity:1;transform:scale(.6)}100%{opacity:0;transform:scale(3.2)}}
.lr-flash{position:absolute;inset:0;background:var(--rc);opacity:0;z-index:4;pointer-events:none}
.lr-flash.lr-go{animation:lrFlash .6s ease-out}
@keyframes lrFlash{0%{opacity:.75}100%{opacity:0}}
.lr-sparks{position:absolute;left:50%;top:44%;width:0;height:0;z-index:3}
.lr-sparks span{position:absolute;width:var(--s,7px);height:var(--s,7px);border-radius:2px;background:var(--col);opacity:0}
.lr-sparks.lr-go span{animation:lrSpark var(--d,1s) cubic-bezier(.2,.7,.3,1) forwards}
@keyframes lrSpark{0%{opacity:1;transform:translate(-50%,-50%) rotate(0)}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r))}}
.lr-ov-text{position:absolute;left:16px;right:16px;top:61%;text-align:center;display:grid;gap:8px;justify-items:center;z-index:5;opacity:0;transform:translateY(12px);transition:opacity .35s,transform .45s cubic-bezier(.3,1.4,.5,1)}
.lr-ov-text.lr-on{opacity:1;transform:none}
.lr-ov-text .chip{font-size:10px}
.lr-ov-name{margin:0;font:700 24px/1.15 var(--f-display);color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.lr-ov-sub{margin:0;font-size:12px;color:#ffffffb3}
.lr-ov-hint{position:absolute;bottom:26px;left:0;right:0;text-align:center;font:11px var(--f-mono);color:#ffffff80;z-index:5;opacity:0;transition:opacity .3s}
#lr-ov.lr-rolling .lr-ov-hint{opacity:1}
/* ---- big moments: legendary + mythic ---- */
.lr-big-die.lr-charge .lr-spin{animation:lrCharge 1s ease-in forwards}
@keyframes lrCharge{0%{transform:scale(1)}20%{transform:scale(1.04) translate(-2px,1px)}40%{transform:scale(1.08) translate(2px,-1px)}60%{transform:scale(1.12) translate(-3px,2px)}80%{transform:scale(1.18) translate(3px,-2px)}100%{transform:scale(1.22)}}
.lr-big-die.lr-charge.lr-m .lr-spin{animation:lrChargeM 1.4s ease-in forwards}
@keyframes lrChargeM{0%{transform:scale(1) rotate(0);filter:hue-rotate(0)}25%{transform:scale(1.06) rotate(-6deg) translate(-3px,2px);filter:hue-rotate(90deg)}50%{transform:scale(1.14) rotate(6deg) translate(3px,-2px);filter:hue-rotate(180deg)}75%{transform:scale(1.22) rotate(-8deg) translate(-4px,3px);filter:hue-rotate(270deg)}100%{transform:scale(1.32) rotate(0);filter:hue-rotate(360deg)}}
.lr-big-die.lr-slam .lr-spin{animation:lrSlam .7s cubic-bezier(.2,1.8,.4,1)}
@keyframes lrSlam{0%{transform:scale(1.6)}40%{transform:scale(.85)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.lr-aura{position:absolute;left:50%;top:44%;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;background:radial-gradient(circle,var(--rc) 0,transparent 65%);opacity:0;z-index:1;pointer-events:none}
.lr-aura.lr-charge{animation:lrAuraC 1.2s ease-in forwards}
@keyframes lrAuraC{0%{opacity:0;transform:scale(.4)}100%{opacity:.9;transform:scale(1.1)}}
.lr-aura.lr-burst{animation:lrAuraB 3.2s ease-out forwards}
@keyframes lrAuraB{0%{opacity:1;transform:scale(1.2)}15%{opacity:.85;transform:scale(1.9)}100%{opacity:.35;transform:scale(1.4)}}
.lr-aura.lr-rainbow{background:conic-gradient(from 0deg,#ff7eb3,#ffd36e,#7affc1,#6ec8ff,#c58bff,#ff7eb3);-webkit-mask:radial-gradient(circle,#000 0,transparent 65%);mask:radial-gradient(circle,#000 0,transparent 65%)}
.lr-aura.lr-rainbow.lr-burst{animation:lrAuraB 3.6s ease-out forwards,lrSpinr 3.6s linear}
@keyframes lrSpinr{to{rotate:360deg}}
.lr-rays.lr-go.lr-big{animation:lrRaysBig 3.6s ease-out forwards}
@keyframes lrRaysBig{0%{opacity:0;transform:rotate(0) scale(.3)}12%{opacity:1;transform:rotate(20deg) scale(1.15)}100%{opacity:0;transform:rotate(200deg) scale(1.35)}}
.lr-rays2{position:absolute;left:50%;top:44%;width:620px;height:620px;margin:-310px 0 0 -310px;border-radius:50%;opacity:0;z-index:1;background:repeating-conic-gradient(from 10deg,#ffffff 0 2deg,transparent 2deg 15deg);-webkit-mask:radial-gradient(circle,#000 0 12%,transparent 58%);mask:radial-gradient(circle,#000 0 12%,transparent 58%)}
.lr-rays2.lr-go{animation:lrRays2 3.4s ease-out forwards}
@keyframes lrRays2{0%{opacity:0;transform:rotate(0)}15%{opacity:.6}100%{opacity:0;transform:rotate(-160deg)}}
.lr-ring.lr-r3,.lr-ring.lr-r4{border-width:5px}
.lr-ring.lr-go.lr-r3{animation:lrRing 1.1s ease-out .35s forwards}
.lr-ring.lr-go.lr-r4{animation:lrRing 1.3s ease-out .55s forwards}
.lr-rain{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.lr-rain span{position:absolute;top:-24px;width:var(--w);height:var(--h);border-radius:var(--br);background:var(--col);opacity:0;animation:lrRain var(--d) cubic-bezier(.3,.1,.6,1) var(--dl) forwards}
@keyframes lrRain{0%{opacity:1;transform:translate(0,0) rotate(0) rotateY(0)}100%{opacity:1;transform:translate(var(--dx),110vh) rotate(var(--r)) rotateY(720deg)}}
.lr-rain .lr-coin{background:radial-gradient(circle at 35% 35%,#fff6c8,#f0b64f 45%,#a9741a);box-shadow:inset 0 0 0 1.5px #ffe08a}
.lr-slam-title{position:absolute;left:0;right:0;top:15%;text-align:center;z-index:7;pointer-events:none;font:800 44px/1 var(--f-display);letter-spacing:.06em;opacity:0;color:var(--rc);text-shadow:0 0 24px var(--rc),0 4px 0 #0008}
.lr-slam-title.lr-go{animation:lrSlamT 2.8s cubic-bezier(.2,1.6,.4,1) forwards}
.lr-slam-title.lr-rainbow{background:linear-gradient(90deg,#ff7eb3,#ffd36e,#7affc1,#6ec8ff,#c58bff,#ff7eb3);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 14px #ff9cd0);animation:lrSlamT 3.4s cubic-bezier(.2,1.6,.4,1) forwards,lrHoloText 1.2s linear infinite}
@keyframes lrSlamT{0%{opacity:0;transform:scale(3.2) rotate(-8deg)}14%{opacity:1;transform:scale(.92) rotate(2deg)}22%{transform:scale(1.05) rotate(0)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15) translateY(-10px)}}
@keyframes lrHoloText{to{background-position:200% 0}}
#lr-frame.lr-glow-l{animation:lrGlowL 3.2s ease-out}
@keyframes lrGlowL{0%,100%{box-shadow:inset 0 0 0 0 transparent}15%{box-shadow:inset 0 0 0 4px #f0b64f,inset 0 0 70px 18px #f0b64faa}}
#lr-frame.lr-glow-m{animation:lrGlowM 3.8s ease-out}
@keyframes lrGlowM{0%,100%{box-shadow:inset 0 0 0 0 transparent}10%{box-shadow:inset 0 0 0 4px #ff7eb3,inset 0 0 80px 22px #ff7eb3aa}30%{box-shadow:inset 0 0 0 4px #ffd36e,inset 0 0 80px 22px #ffd36eaa}50%{box-shadow:inset 0 0 0 4px #7affc1,inset 0 0 80px 22px #7affc1aa}70%{box-shadow:inset 0 0 0 4px #6ec8ff,inset 0 0 80px 22px #6ec8ffaa}90%{box-shadow:inset 0 0 0 4px #c58bff,inset 0 0 60px 14px #c58bff88}}
#lr-ov.lr-quake-big{animation:lrQuakeBig .9s}
@keyframes lrQuakeBig{0%,100%{transform:none}10%{transform:translate(-9px,4px) rotate(-1.5deg)}20%{transform:translate(9px,-4px) rotate(1.5deg)}30%{transform:translate(-8px,3px) rotate(-1deg)}40%{transform:translate(8px,-3px) rotate(1deg)}55%{transform:translate(-5px,2px)}70%{transform:translate(5px,-2px)}85%{transform:translate(-2px,1px)}}
.lr-ov-name.lr-big{font-size:28px;animation:lrNameIn .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes lrNameIn{0%{transform:scale(.4);opacity:0;letter-spacing:.4em}100%{transform:scale(1);opacity:1;letter-spacing:0}}
/* rarity effects on themes */
.lr-shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);background-size:250% 100%;animation:lrShine 3.2s linear infinite;mix-blend-mode:overlay}
@keyframes lrShine{from{background-position:150% 0}to{background-position:-100% 0}}
.lr-holo{position:absolute;inset:0;background:linear-gradient(120deg,#ff7eb3,#ffd36e,#7affc1,#6ec8ff,#c58bff,#ff7eb3);background-size:300% 300%;mix-blend-mode:soft-light;opacity:.55;animation:lrHolo 6s ease infinite}
@keyframes lrHolo{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.lr-star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:lrTwinkle 2.4s ease-in-out infinite}
@keyframes lrTwinkle{0%,100%{opacity:.15}50%{opacity:1}}
.lr-petal{position:absolute;top:-10px;width:8px;height:8px;border-radius:8px 0;background:#ffc4dc;animation:lrFall linear infinite;opacity:.8}
@keyframes lrFall{to{transform:translate(-30px,110vh) rotate(540deg)}}
#lr-fx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#lr-die{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:15;width:58px;height:58px;padding:0;border:0;background:none;cursor:pointer;animation:lrBob 3s ease-in-out infinite;filter:drop-shadow(0 8px 14px rgba(0,0,0,.4));-webkit-tap-highlight-color:transparent}
#lr-die svg{width:100%;height:100%;overflow:visible}
#lr-die:hover{animation-play-state:paused;transform:scale(1.08) rotate(-8deg)}
#lr-die:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:12px}
#lr-die.lr-hide{visibility:hidden}
#lr-frame{position:fixed;inset:0;z-index:201;pointer-events:none}
#lr-auto{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(142px + env(safe-area-inset-bottom,0px));z-index:16;display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--surface);color:var(--ink);font:700 12px var(--f-body);cursor:pointer;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.18);transition:transform .15s}
#lr-auto:active{transform:scale(.95)}
#lr-auto[aria-pressed=true]{z-index:203;padding:9px 16px;font-size:14px;background:#e5484d;border-color:#e5484d;color:#fff;animation:lrAutoPulse 1.6s ease-in-out infinite}
@keyframes lrAutoPulse{0%,100%{box-shadow:0 0 0 0 #e5484d66}50%{box-shadow:0 0 0 6px #e5484d00}}
.lr-head-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

.lr-chip{display:inline-flex;align-items:center;gap:6px;width:max-content;padding:3px 10px;border-radius:999px;font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--rc);border:1px solid color-mix(in srgb,var(--rc) 55%,transparent);background:color-mix(in srgb,var(--rc) 12%,transparent)}
.lr-ov-text .lr-chip{font-size:10px}
.lr-sw{position:relative;display:block;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:var(--t-bg);border:1px solid #ffffff1f}
.lr-sw::before{content:"";position:absolute;inset:0;background:var(--t-pattern,none)}
.lr-sw i{position:absolute;left:10px;bottom:10px;width:24px;height:24px;border-radius:50%;background:var(--t-accent);box-shadow:0 0 0 2px #0006,0 0 0 4px var(--t-accent)}
.lr-sw-die{background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--rc) 30%,transparent),transparent 70%),var(--soft);display:grid;place-items:center}
.lr-sw-die::before{display:none}.lr-sw-die svg{height:78%;width:auto;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
.lr-keep .lr-sw-die svg{height:70%}
#lr-die.lr-die-fancy{filter:drop-shadow(0 8px 14px rgba(0,0,0,.4)) drop-shadow(0 0 8px color-mix(in srgb,var(--rc) 70%,transparent))}
.lr-sw u{position:absolute;right:10px;bottom:12px;left:44px;height:8px;border-radius:4px;background:var(--t-card);border:1px solid var(--t-line)}
.lr-keep{display:flex;gap:14px;align-items:center}
.lr-small{font-size:12px;margin-top:6px!important}
.lr-link{border:0;background:none;padding:0;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer}
@media (max-width:480px){.lr-keep{flex-direction:column;align-items:stretch;text-align:left}.lr-keep .lr-sw{width:100%;max-height:120px}}
.lr-keep .lr-sw{width:88px;flex:none}
.lr-keep h2{margin:0 0 4px}
.lr-keep p{margin:0}
.lr-keep-btn{background:var(--rc,var(--accent));border-color:var(--rc,var(--accent));color:#120f1f}
.lr-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lr-head h2{margin:0}.lr-head p{margin:2px 0 0}
.lr-odds{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.lr-odds .lr-chip{font-size:10px;padding:2px 8px}
.lr-default{width:100%;justify-content:center;margin:0 0 10px}
.lr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(140px,100%),1fr));gap:10px;max-height:min(52vh,460px);overflow:auto;padding:2px}
.lr-tile{position:relative;min-width:0;display:grid;gap:6px;padding:7px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.lr-tile:hover,.lr-tile:focus-visible{border-color:var(--rc);outline:none}

/* tiny markdown: # ## ### headings, - bullets, 1. lists, > high-yield callouts, **bold**, *italic*, `code` */
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[\s(])\*(\S(?:.*?\S)?)\*/g,"$1<em>$2</em>").replace(/`(.+?)`/g,"<code>$1</code>")}
function md(src){
  const lines=String(src||"").replace(/\r/g,"").split("\n");let out="",list=null,para=[],quote=[];
  const flushP=()=>{if(para.length){out+=`<p>${inline(para.join(" "))}</p>`;para=[]}};
  const flushL=()=>{if(list){out+=`</${list}>`;list=null}};
  const flushQ=()=>{if(quote.length){out+=`<blockquote>${md(quote.join("\n"))}</blockquote>`;quote=[]}};
  for(const raw of lines){const l=raw.trimEnd();let m;
    if(/^>\s?/.test(l)){flushP();flushL();quote.push(l.replace(/^>\s?/,""));continue}else flushQ();
    if(!l.trim()){flushP();flushL();continue}
    if(m=l.match(/^(#{1,3})\s+(.*)/)){flushP();flushL();const t=["h3","h3","h4"][m[1].length-1];out+=`<${t}>${inline(m[2])}</${t}>`;continue}
    if(m=l.match(/^\s*[-*•]\s+(.*)/)){flushP();if(list!=="ul"){flushL();out+="<ul>";list="ul"}out+=`<li>${inline(m[1])}</li>`;continue}
    if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){flushP();if(list!=="ol"){flushL();out+="<ol>";list="ol"}out+=`<li>${inline(m[1])}</li>`;continue}
    flushL();para.push(l.trim());
  }
  flushP();flushL();flushQ();return out;
}

const OVERLAY_KEY="study-atlas-edits-v1";
function loadOverlay(){if(true)return{up:{subjects:{},notes:{},questions:{}},del:{subjects:{},notes:{},questions:{}}};try{const o=JSON.parse(localStorage.getItem(OVERLAY_KEY)||"null");if(o&&o.up&&o.del)return o}catch(e){}return{up:{subjects:{},notes:{},questions:{}},del:{subjects:{},notes:{},questions:{}}}}

function saveOverlay(){localStorage.setItem(OVERLAY_KEY,JSON.stringify(OV))}
function merged(){const base=window.STUDY_DATA||{};const out={};
  ["subjects","notes","questions"].forEach(n=>{const m=new Map();(base[n]||[]).forEach(d=>m.set(d.id,d));
    Object.entries(OV.up[n]||{}).forEach(([id,d])=>m.set(id,{...d,id}));Object.keys(OV.del[n]||{}).forEach(id=>m.delete(id));out[n]=[...m.values()]});return out}

  delete:async()=>{delete OV.up[n][id];OV.del[n][id]=1;saveOverlay();refresh()}})});
function exportData(){const m=merged();const strip=a=>a.map(({...d})=>d);

const GREETS=["What are we reviewing today, {n}?","Ready to study, {n}?","Which topic is it today, {n}?","Let's get some reps in, {n}.","Brain warmed up, {n}?","One topic at a time, {n}.","What's on the review list, {n}?","Small steps, big grades, {n}.","Coffee ready? Let's go, {n}.","Time to make it stick, {n}.","Which notes are we opening, {n}?","You've got this, {n}. Pick a subject."];
let GREET_I=0;const GREET_MS=20000;
function myNick(){const u=LIVE.user;if(!u)return"";return (LIVE.nick!=null?LIVE.nick:(store("nick-"+u.uid)||"")).trim()}
function firstName(){const u=LIVE.user;const nk=myNick();if(nk)return nk;const n=niceName((u&&(u.displayName||""))||"").trim().split(/\s+/)[0]||"";return n}
function helloLine(){const n=firstName();if(!n)return"";const h=new Date().getHours();
  const part=h<5?"Hi":h<12?"Good morning":h<18?"Good afternoon":"Good evening";
  return `<span class="hello">${part}, <button type="button" class="shine nick-btn" data-act="edit-nick" title="Change the name shown here">${esc(n)}</button>.</span>`}
function greetText(){const n="",g=GREETS[GREET_I%GREETS.length];return n?g.replace("{n}",n):g.replace(/,? \{n\}/,"")}
function swapGreet(){const el=document.getElementById("greet");if(!el||document.hidden)return;GREET_I++;const next=greetText();
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!el.animate){el.textContent=next;return}
  const out=el.animate(still?[{opacity:1},{opacity:0}]:[{opacity:1,transform:"translateY(0)",filter:"blur(0)"},{opacity:0,transform:"translateY(-8px)",filter:"blur(4px)"}],{duration:600,easing:"ease-in",fill:"forwards"});
  out.onfinish=()=>{const cur=document.getElementById("greet");if(!cur)return;cur.textContent=next;
    cur.animate(still?[{opacity:0},{opacity:1}]:[{opacity:0,transform:"translateY(8px)",filter:"blur(4px)"},{opacity:1,transform:"translateY(0)",filter:"blur(0)"}],{duration:700,easing:"ease-out",fill:"forwards"});
    if(cur!==el)el.getAnimations().forEach(x=>x.cancel())}}
setInterval(swapGreet,GREET_MS);
function niceName(n){n=String(n||"");return n.includes("@")||/[A-Z]/.test(n)?n:n.replace(/(^|\s)\S/g,c=>c.toUpperCase())}
function isDark(){const t=document.documentElement.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function toggleTheme(){const t=isDark()?"light":"dark";document.documentElement.dataset.theme=t;store("theme",t);render()}

function searchIndex(){const out=[];
  S.subjects.forEach(s=>out.push({k:"Subject",t:s.name,sub:s.blurb||"",href:"#s-"+s.id,c:stainVar(s.stain),txt:(s.name+" "+(s.blurb||"")).toLowerCase()}));
  ((window.STUDY_DATA||{}).docs||[]).forEach(d=>{const s=subj(d.subject);out.push({k:"Topic",t:d.title,sub:(s?s.name:"")+(d.desc?" · "+d.desc:""),href:"#d-"+d.id,c:stainVar(s?.stain),txt:(d.title+" "+(d.desc||"")+" "+(s?s.name:"")).toLowerCase()})});
  S.notes.forEach(n=>{const s=subj(n.subject);out.push({k:"Note",t:n.title,sub:s?s.name:"",href:"#s-"+n.subject,note:n.id,c:stainVar(s?.stain),txt:(n.title+" "+(s?s.name:"")).toLowerCase()})});
  return out}
function searchRows(q){q=q.trim().toLowerCase();const idx=searchIndex();
  const words=q.split(/\s+/).filter(Boolean);
  const hits=words.length?idx.filter(x=>words.every(w=>x.txt.includes(w))).sort((a,b)=>(b.t.toLowerCase().startsWith(words[0])-a.t.toLowerCase().startsWith(words[0]))||(a.k==="Topic"?-1:0)):idx.filter(x=>x.k!=="Note");
  return hits.slice(0,30)}
function paintSearch(q){const ul=document.getElementById("sx-list");if(!ul)return;const hits=searchRows(q);
  ul.innerHTML=hits.length?hits.map((h,i)=>`<li><a href="${esc(h.href)}" ${h.note?`data-note="${esc(h.note)}"`:""} class="${i?"":"sel"}" style="--c:${h.c}"><span class="k"></span><span class="t">${esc(h.t)}${h.sub?`<small>${esc(h.sub)}</small>`:""}</span><span class="mono">${h.k}</span></a></li>`).join(""):`<li class="sx-empty">Nothing matches “${esc(q)}”.</li>`}
function openSearch(){document.querySelectorAll("details.me[open]").forEach(d=>d.open=false);
  openSheet(`<div class="sx-head"><h2>Search Study Atlas</h2><button type="button" class="sx-x" data-act="close" aria-label="Close search">✕</button></div><input class="sx-input" id="sx-q" type="text" placeholder="Try “basal ganglia” or “thigh”" autocomplete="off" aria-label="Search"><ul class="sx-list" id="sx-list"></ul><p class="mono sx-keys" style="margin:6px 0 0">↑ ↓ to move · Enter to open · Esc to close</p>`);
  paintSearch("");const inp=document.getElementById("sx-q");
  inp.addEventListener("input",()=>paintSearch(inp.value));
  inp.addEventListener("keydown",e=>{const as=[...document.querySelectorAll("#sx-list a")];let i=as.findIndex(a=>a.classList.contains("sel"));
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!as.length)return;as[i]?.classList.remove("sel");i=(i+(e.key==="ArrowDown"?1:-1)+as.length)%as.length;as[i].classList.add("sel");as[i].scrollIntoView({block:"nearest"})}
    else if(e.key==="Enter"){e.preventDefault();as[Math.max(0,i)]?.click()}})}

const canEdit=()=>false;

function render(){
  const r=route();try{lrPaintDie()}catch(e){}const fl=document.getElementById("foot-links");if(fl)fl.hidden=!(LIVE.on&&LIVE.user);
  if(LIVE.on&&!LIVE.authReady){app.innerHTML=topbar()+`<div class="loading">Checking your sign-in…</div>`;return}
  if(LIVE.on&&!LIVE.user)return renderSignIn();
  try{statView()}catch(e){}
  if(r.v==="admin")return renderAdmin();
  if(S.mode==="loading"){app.innerHTML=topbar()+`<div class="loading">${S.slow?"Your notes can't be reached yet. They'll appear here as soon as the connection catches up.":"Opening your study atlas…"}</div>`;return}
  if(S.mode==="error"&&!S.subjects.length){app.innerHTML=topbar()+`<div class="empty" style="margin-top:40px"><h3>Your notes didn't load</h3><p>Reload the page to try again.</p></div>`;return}
  if(r.v==="subject")return renderSubject(r.id);

function renderQuiz(id){
  const s=subj(id),back=topbar(`<a class="back" href="#s-${esc(id)}">← Back to notes</a>`);
  if(!s){app.innerHTML=back+`<div class="empty"><h3>This subject isn't here</h3><a class="btn" href="#">All subjects</a></div>`;return}
  const all=qsOf(id),c=stainVar(s.stain),Z=S.quiz;
  if(!Z||Z.subject!==id){
    const best=store("best-"+id);
    app.innerHTML=back+`<div class="quiz" style="--c:${c}"><div class="qcard"><span class="mono eyebrow" style="color:${c}">Quiz</span><h2 style="font-size:clamp(26px,4vw,34px)">${esc(s.name)}</h2>
      ${all.length?`<p style="margin:0;color:var(--muted)">${plural(all.length,"question")} in the bank, shuffled each time. Keys 1–5 pick an answer and Enter moves on.${best?` Your best so far is ${esc(best)}%.`:""}</p>
      ${LIVE.on?`<p class="mono" style="margin:0">Your score will show on the leaderboard as ${esc(playerName())}.</p>`:""}
      <div class="actions">${all.length>10?`<button class="btn primary" data-act="start" data-n="10">Start · 10 questions</button><button class="btn" data-act="start" data-n="all">All ${all.length}</button>`:`<button class="btn primary" data-act="start" data-n="all">Start · ${plural(all.length,"question")}</button>`}</div>`
      :`<div class="coming"><svg viewBox="0 0 120 90" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--c,var(--accent))"><rect x="22" y="12" width="62" height="72" rx="8" opacity=".35"/><rect x="34" y="6" width="62" height="72" rx="8" fill="var(--surface)"/><path d="M46 26h30M46 38h22M46 50h26"/><circle cx="46" cy="62" r="3"/><path d="M54 62h18"/><path d="M88 58l14-14 6 6-14 14-8 2z" fill="var(--surface)"/></svg><h3>Quizzes coming soon</h3><p style="margin:0;color:var(--muted);max-width:42ch">Practice questions for this subject are being written. Check back after the next upload.</p></div><div style="text-align:center"><a class="btn" href="#s-${esc(id)}">Go to ${esc(s.name)}</a></div>`}</div>${liveSlot(id)}</div>`;
    return;
  }
  if(Z.i>=Z.items.length){
    const right=Z.items.filter(q=>q.picked===q.answer).length,pct=Math.round(right/Z.items.length*100);
    const prev=+store("best-"+id)||0;if(!Z.saved){Z.saved=1;Z.newBest=pct>prev&&Z.full;if(Z.newBest)store("best-"+id,String(pct));if(!Z.retry)postAttempt(id,right,Z.items.length)}
    const missed=Z.items.filter(q=>q.picked!==q.answer);
    app.innerHTML=back+`<div class="quiz" style="--c:${c}"><div class="qcard"><div class="score"><span class="mono eyebrow">${esc(s.name)} · result</span>
      <span class="big">${right}/${Z.items.length}</span><span class="mono">${pct}% correct${Z.newBest?" · new best":""}</span></div>
      ${missed.length?`<h3 style="font-size:18px">Review what you missed</h3><ul class="missed">${missed.map(q=>`<li><div>${esc(q.prompt)}</div><div class="ans">${esc(q.choices[q.answer])}</div>${q.explain?`<div class="mono" style="font-size:13px;letter-spacing:0">${esc(q.explain)}</div>`:""}</li>`).join("")}</ul>`:`<p style="text-align:center;margin:0">Perfect score. Nice work.</p>`}
      <div class="qnav">${missed.length?`<button class="btn primary" data-act="retry-missed">Retry the ${missed.length} missed</button>`:""}<button class="btn" data-act="start" data-n="${Z.items.length>=all.length?"all":Z.items.length}">New quiz</button><a class="btn ghost" href="#s-${esc(id)}">Back to notes</a></div></div>${liveSlot(id)}</div>`;
    return;
  }
  const q=Z.items[Z.i],done=q.picked!=null;
  app.innerHTML=back+`<div class="quiz" style="--c:${c}"><div class="qnav"><span class="mono">${esc(s.name)} · question ${Z.i+1} of ${Z.items.length}</span><span class="mono">${Z.items.filter(x=>x.picked===x.answer).length} correct</span></div>
    <div class="progress"><span style="width:${(Z.i+(done?1:0))/Z.items.length*100}%"></span></div>
    <div class="qcard"><h2>${esc(q.prompt)}</h2><div class="choices">${q.choices.map((ch,i)=>{
      let cls="";if(done){if(i===q.answer)cls="right";else if(i===q.picked)cls="wrong"}
      return `<button class="choice ${cls}" data-act="pick" data-i="${i}" ${done?"disabled":""}><span class="k">${L[i]}</span><span>${esc(ch)}</span></button>`}).join("")}</div>
    ${done?`<div class="verdict ${q.picked===q.answer?"ok":"no"}"><strong>${q.picked===q.answer?"Correct":"Not quite. The answer is "+L[q.answer]+"."}</strong>${q.explain?esc(q.explain):""}</div>`:""}
    <div class="qnav"><button class="btn ghost" data-act="quit">End quiz</button>${done?`<button class="btn primary" data-act="next" id="next-btn">${Z.i+1<Z.items.length?"Next question →":"See results"}</button>`:""}</div></div></div>`;
  if(done)document.getElementById("next-btn")?.focus();
}
function startQuiz(id,items,full,retry){
  S.quiz={subject:id,i:0,full,retry:!!retry,items:items.map(q=>{
    // shuffle choices but keep track of the right one
    const order=shuffle(q.choices.map((_,i)=>i).filter(i=>String(q.choices[i]||"").trim()));
    return{prompt:q.prompt,explain:q.explain,choices:order.map(i=>q.choices[i]),answer:order.indexOf(q.answer),picked:null,src:q}})};
  render();scrollTo(0,0);
}

function popBurst(el,ev){

  const r=el.getBoundingClientRect(),x=ev&&ev.clientX?ev.clientX:r.left+r.width/2,y=ev&&ev.clientY?ev.clientY:r.top+r.height/2;

    h+=`<span class="bit" style="--bc:${cols[i%cols.length]};--x:${Math.cos(ang)*dist}px;--y:${Math.sin(ang)*dist}px;--r:${Math.random()*540-270}deg;border-radius:${i%3?"3px":"50%"}"></span>`}

const PDF_FILES={};
function prefetchPdf(href,name){if(!IS_STANDALONE||PDF_FILES[href])return;PDF_FILES[href]={p:fetch(href).then(r=>{if(!r.ok)throw 0;return r.blob()}).then(bl=>PDF_FILES[href].f=new File([bl],name,{type:"application/pdf"})).catch(()=>{delete PDF_FILES[href]})}}

  box.innerHTML=`<div class="row"><span class="ic" aria-hidden="true">⤓</span><b>${esc(msg||("Downloading "+name))}</b><button type="button" class="x" aria-label="Close">×</button></div><p>These notes are free, always. If they've helped you, you can <a href="#support">chip in to keep the site running</a> ♥</p>`;
  document.body.appendChild(box);requestAnimationFrame(()=>box.classList.add("in"));
  const close=()=>{clearTimeout(box._t);box.classList.remove("in");setTimeout(()=>box.remove(),300)};box.querySelector(".x").onclick=close;box._close=close;return box}
function prepDownload(href,name){
  if(IS_STANDALONE){const f=PDF_FILES[href]&&PDF_FILES[href].f;
    if(f&&navigator.canShare&&navigator.share&&navigator.canShare({files:[f]})){
      navigator.share({files:[f],title:name}).catch(e=>{if(!e||e.name!=="AbortError")blobDownload(f,name)});
      const box=prepBox(name,"Saving "+name);box._t=setTimeout(box._close,4000);return}
    if(f&&!(navigator.canShare&&navigator.share)){blobDownload(f,name);const box=prepBox(name);box._t=setTimeout(box._close,4000);return}
    const box=prepBox(name,"Getting "+name+" ready…");saveInApp(href,name,box,box._close);return}

/* In the Home Screen app a plain download opens the PDF full screen with no way back (iPhone/iPad).
   So there we fetch the file and hand it to the phone's own Save/Share sheet ("Save to Files", Drive, Books…). */
async function saveInApp(href,name,box,close){
  const b=box.querySelector("b");
  let file;try{prefetchPdf(href,name);if(PDF_FILES[href])await PDF_FILES[href].p;file=PDF_FILES[href]&&PDF_FILES[href].f;if(!file)throw new Error("fetch")}
  catch(e){b.textContent="Couldn't get the PDF. Check your connection and try again.";return}
  if(!box.isConnected)return;
  const share=!!(navigator.canShare&&navigator.share&&navigator.canShare({files:[file]}));
  b.textContent=name+" is ready";
  const btn=document.createElement("button");btn.type="button";btn.className="btn primary save";
  btn.innerHTML='<span aria-hidden="true">⤓</span> Save to your device';

  btn.after(tip);
  btn.onclick=async()=>{
    if(share){try{await navigator.share({files:[file],title:name});close()}catch(e){if(e&&e.name==="AbortError")return;blobDownload(file,name);close()}}

/* ---- sounds, made in the browser (no files) ---- */
let LR_AC=null;
function lrAc(){if(!LR.snd)return null;try{LR_AC=LR_AC||new (window.AudioContext||window.webkitAudioContext)();if(LR_AC.state==="suspended")LR_AC.resume();return LR_AC}catch(e){return null}}
function lrTone(f,t0,dur,type="sine",vol=.18,f2){const c=lrAc();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,c.currentTime+t0);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,c.currentTime+t0+dur);
  g.gain.setValueAtTime(0,c.currentTime+t0);g.gain.linearRampToValueAtTime(vol,c.currentTime+t0+.01);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t0+dur);
  o.connect(g).connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+dur+.05)}
function lrNoise(t0,dur,vol=.25,freq=2500,q=1.2){const c=lrAc();if(!c)return;const len=Math.ceil(c.sampleRate*dur),b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const src=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain();src.buffer=b;bp.type="bandpass";bp.frequency.value=freq;bp.Q.value=q;g.gain.value=vol;src.connect(bp).connect(g).connect(c.destination);src.start(c.currentTime+t0)}
const LR_SFX={
  /* everything sits high (2–8 kHz): small, glassy, "dinky" */
  plink(f,t0=0,vol=.12,dur=.18){lrTone(f,t0,dur,"sine",vol);lrTone(f*2.01,t0,dur*.6,"sine",vol*.35)},
  whoosh(){lrNoise(0,.3,.1,5200,1.4);lrTone(1800,0,.28,"sine",.05,4200)},
  rattle(ms){for(let t=0;t<ms/1000;t+=.05+Math.random()*.045){lrNoise(t,.025,.22,5000+Math.random()*3000,6);if(Math.random()<.5)LR_SFX.plink(2600+Math.random()*2400,t,.04,.06)}},
  thud(){LR_SFX.plink(3136,0,.16,.22);lrNoise(0,.03,.2,6500,3)},
  win(r){const scale={common:[2093],rare:[2093,3136],epic:[2093,2637,3136,4186],legendary:[2093,2637,3136,4186,5274],mythic:[2093,2637,3136,3951,4699,6272,8372]}[r];
    scale.forEach((f,i)=>LR_SFX.plink(f,.05+i*.075,.11,.25));
    if(r==="legendary"||r==="mythic")scale.forEach((f,i)=>LR_SFX.plink(f*1.5,.09+i*.075,.04,.3));
    if(r==="legendary")for(let i=0;i<14;i++)LR_SFX.plink(3500+Math.random()*3000,.5+i*.07,.035,.1);
    if(r==="mythic"){for(let i=0;i<30;i++)LR_SFX.plink(4000+Math.random()*4500,.55+i*.045,.04,.12);[2093,2637,3136,4186].forEach((f,i)=>LR_SFX.plink(f,1.5+i*.12,.09,.5));[4186,5274,6272].forEach(f=>LR_SFX.plink(f,2.05,.07,.9))}},
  riser(sec){for(let i=0;i<14;i++)LR_SFX.plink(1800+i*260,i*sec/14,.05+i*.004,.1);lrNoise(0,sec,.06,6000,2)},
  shrink(){lrTone(4200,0,.18,"sine",.05,2100)},
  ask(){LR_SFX.plink(3136,0,.08,.15);LR_SFX.plink(4186,.09,.08,.2)},
  click(){LR_SFX.plink(4186,0,.06,.06)}

function lrDieSvg(n,c1,c2,uid){

  const P={T:[50,3],UR:[92,27],LR:[92,73],B:[50,97],LL:[8,73],UL:[8,27],A:[50,23],R:[75,65],L:[25,65]};
  const F=[["T","UL","A",.42,0],["T","A","UR",.3,0],["UR","A","R",.12,0],["UR","R","LR",0,.1],["LR","R","B",0,.32],["B","R","L",0,.22],["B","L","LL",0,.4],["LL","L","UL",0,.18],["UL","L","A",.22,0]];
  const pts=k=>k.map(x=>P[x].join(",")).join(" ");
  const faces=F.map(([a,b,c,w,k])=>`<polygon points="${pts([a,b,c])}" fill="url(#lrg${uid})"/><polygon points="${pts([a,b,c])}" fill="${w?"#fff":"#000"}" fill-opacity="${w||k}"/>`).join("");

    <linearGradient id="lrg${uid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>

    <linearGradient id="lrs${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
  <polygon points="${pts(["T","UR","LR","B","LL","UL"])}" fill="#000" fill-opacity=".25" transform="translate(0 2.5)"/>
  ${faces}
  <polygon points="${pts(["A","R","L"])}" fill="url(#lrg${uid})"/><polygon points="${pts(["A","R","L"])}" fill="url(#lrc${uid})"/>
  <g fill="none" stroke="#fff" stroke-linejoin="round"><polygon points="${pts(["T","UR","LR","B","LL","UL"])}" stroke-opacity=".55" stroke-width="1.6"/>
    <path d="M${P.T} L${P.A} M${P.UR} L${P.A} M${P.UL} L${P.A} M${P.UR} L${P.R} M${P.LR} L${P.R} M${P.B} L${P.R} M${P.B} L${P.L} M${P.LL} L${P.L} M${P.UL} L${P.L}" stroke-opacity=".3" stroke-width="1"/>
    <polygon points="${pts(["A","R","L"])}" stroke-opacity=".7" stroke-width="1.3"/></g>
  <path d="M16 27 L48 8.5" stroke="url(#lrs${uid})" stroke-width="2.4" stroke-linecap="round" opacity=".8"/>
  <ellipse cx="38" cy="38" rx="7" ry="3.2" fill="#fff" opacity=".35" transform="rotate(-32 38 38)"/>
  <text x="50" y="57" text-anchor="middle" class="lr-die-num">${n}</text></svg>`}

/* ---------- Lucky Roll ----------
   A d20 on the home screen. Unlimited rolls with RNG-style odds unlock designs (skins) for the whole site
   and for your profile card. Saved on this device and in users/{uid} (skins, skin, rolls); your skin shows
   to others through presence.skin. */
const LR_DEF=()=>({owned:["default"],eq:"default",rolls:0,snd:true});
let LR_AUTO=false; /* auto roll: on until they turn it off, leave the home page or close the app */
let LR=LR_DEF(),LR_PREVIEW=null,LR_BUSY=false,LR_SYNC_T=null;
const lrSkin=id=>LR_T.find(t=>t.id===id);
const lrKey=()=>"lucky-"+(LIVE.user?LIVE.user.uid:"anon");
function lrLoad(){try{LR={...LR_DEF(),...JSON.parse(store(lrKey())||"{}")}}catch(e){LR=LR_DEF()}
  LR.owned=[...new Set(["default",...(Array.isArray(LR.owned)?LR.owned:[])].filter(lrSkin))];if(!lrSkin(LR.eq)||!LR.owned.includes(LR.eq))LR.eq="default"}
function lrSave(sync=true){store(lrKey(),JSON.stringify(LR));if(sync){clearTimeout(LR_SYNC_T);LR_SYNC_T=setTimeout(lrPush,2500)}}
async function lrPush(){const u=LIVE.user;if(!LIVE.on||!u)return;const FV=firebase.firestore.FieldValue;
  try{await LIVE.fs.collection("users").doc(u.uid).update({skins:LR.owned.slice(0,40),skin:LR.eq,rolls:LR.rolls|0,lastSeen:FV.serverTimestamp()})}catch(e){console.warn("designs saved on this device only",e)}}
async function lrPull(u){if(!LIVE.on)return;try{const d=await LIVE.fs.collection("users").doc(u.uid).get();if(!d.exists)return;const x=d.data();
  const owned=[...new Set([...LR.owned,...(Array.isArray(x.skins)?x.skins:[])])].filter(lrSkin);
  const changed=owned.length!==LR.owned.length||((x.rolls|0)>LR.rolls)||(LR.eq==="default"&&x.skin&&x.skin!=="default"&&owned.includes(x.skin));
  LR.owned=owned;LR.rolls=Math.max(LR.rolls,x.rolls|0);if(LR.eq==="default"&&x.skin&&owned.includes(x.skin))LR.eq=x.skin;
  if(changed){lrSave(false);applySkin(LR.eq);beat()}
  if((x.rolls|0)<LR.rolls||(Array.isArray(x.skins)?x.skins.length:0)<LR.owned.length||(x.skin||"default")!==LR.eq)lrPush()}catch(e){}}
function lrStart(u){if(!u){LR=LR_DEF();applySkin("default");lrPaintDie();return}
  lrLoad();applySkin(LR.eq);lrPaintDie();setTimeout(()=>lrPull(u),1500)}

/* skins restyle the whole site through the colour tokens */
function lrHex(s){const m=String(s).match(/#[0-9a-f]{6}/gi);return m?m[m.length-1]:"#0d1117"}
function lrLum(h){const n=parseInt(h.slice(1,7),16),c=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function lrVars(t){const v=t.v;return `--t-bg:${v.bg};--t-ink:${v.ink};--t-accent:${v.accent};--t-card:${v.card};--t-line:${v.line};--t-banner:${v.banner};--t-ring:${v.ring};--t-pattern:${v.pattern||"none"};--rc:${LR_R[t.r].c}`}
