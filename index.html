  if(f.includes("stars"))for(let i=0;i<46;i++)h+=`<span class="lr-star" style="left:${(i*37)%100}%;top:${(i*53)%100}%;animation-delay:${(i%7)*.35}s"></span>`;
  if(f.includes("petals"))for(let i=0;i<14;i++)h+=`<span class="lr-petal" style="left:${4+i*7}%;animation-duration:${9+(i%4)*2}s;animation-delay:${-i*1.3}s"></span>`;
  if(f.includes("shine"))h+=`<span class="lr-shine"></span>`;
  if(f.includes("holo"))h+=`<span class="lr-holo"></span>`;
  return h}
/* designs only change the dice now (2026-11-19): the site background and colours always stay the default */
let LR_DIE_C="#b9aeff";
function lrDieColor(t){return !t||t.id==="default"?"#b9aeff":lrHex(t.v.accent)}
function applySkin(id){const t=lrSkin(id)||lrSkin("default"),root=document.documentElement;
  if(root.dataset.skin){delete root.dataset.skin;document.getElementById("skin-style")?.remove();document.getElementById("lr-fx")?.remove();
    const th=store("theme");if(th==="light"||th==="dark")root.dataset.theme=th;else delete root.dataset.theme;if(typeof render==="function"&&LIVE.authReady)render()}
  const c=lrDieColor(t);if(c===LR_DIE_C&&document.getElementById("lr-die")?.dataset.c===c)return;LR_DIE_C=c;lrDieFace()}
function lrDieDark(c){return "#"+[1,3,5].map(i=>Math.round(parseInt(c.slice(i,i+2),16)*.55).toString(16).padStart(2,"0")).join("")}
/* paints the corner dice in the equipped design's colour (3D picture when the 3D dice is loaded) */
function lrDieFace(){const b=document.getElementById("lr-die");if(!b)return;const c=LR_DIE_C,t=lrSkin(LR_PREVIEW||LR.eq);b.dataset.c=c;
  b.style.setProperty("--rc",t&&t.id!=="default"?LR_R[t.r].c:"transparent");b.classList.toggle("lr-die-fancy",!!t&&t.id!=="default");
  if(window.D20&&LR_3D)D20.snapshot(20,c,116,"one").then(url=>{if(b.dataset.c===c)b.innerHTML='<img src="'+url+'" alt="" style="width:100%;height:100%;display:block">'}).catch(()=>{b.innerHTML=lrDieSvg(20,c,lrDieDark(c),"h")});
  else b.innerHTML=lrDieSvg(20,c,lrDieDark(c),"h")}
const skinOn=()=>!!document.documentElement.dataset.skin;

/* the dice in the corner of the home page */
function lrPaintDie(){let b=document.getElementById("lr-die");const show=LIVE.on&&!!LIVE.user&&route().v==="home";
  if(!show){if(b)b.hidden=true;const a=document.getElementById("lr-auto");if(a)a.hidden=true;if(LR_AUTO)lrSetAuto(false);return}
  if(!b){b=document.createElement("button");b.type="button";b.id="lr-die";b.setAttribute("aria-label","Lucky Roll: roll the dice for a new design");b.title="Lucky Roll";b.addEventListener("click",()=>lrRoll());document.body.appendChild(b);lrDieFace()}

  if(!LIVE.isAdmin){app.innerHTML=topbar(back)+`<div class="empty" style="margin-top:30px"><h3>This page is for the site owner</h3><p>Your account ID is <code class="uid">${esc(LIVE.user?.uid||"")}</code></p></div>`;return}
  const byNote={};LIVE.dlog.forEach(d=>{(byNote[d.noteId]=byNote[d.noteId]||{title:d.noteTitle,subject:d.subject,people:new Map()});const p=byNote[d.noteId].people;p.set(d.uid,(p.get(d.uid)||0)+1)});
  const nameOf=uid=>{const u=LIVE.users.find(x=>x.id===uid);return u?(u.name||u.email):(LIVE.dlog.find(d=>d.uid===uid)?.name||"Someone")};
  const notesRows=Object.entries(byNote).map(([id,v])=>({id,...v,total:LIVE.downloads[id]||[...v.people.values()].reduce((a,b)=>a+b,0)})).sort((a,b)=>b.total-a.total);
  const totalDl=Object.values(LIVE.downloads).reduce((a,b)=>a+b,0);
  app.innerHTML=topbar(back)+`<section class="hero"><span class="mono eyebrow">Only you can see this page</span><h1>Who's visiting</h1></section>
   <p class="notice">Tap <b>Let them edit</b> next to a friend to let them add quizzes, exams and reminders to the Schedule. Only you can change who's an editor.</p>
   <div class="stats"><div><span class="big-n">${LIVE.users.length}</span><span class="mono">people signed in</span></div><div><span class="big-n">${LIVE.users.reduce((a,u)=>a+(u.visits||0),0)}</span><span class="mono">total visits</span></div><div><span class="big-n">${totalDl}</span><span class="mono">downloads</span></div><div><span class="big-n">${LIVE.attempts.length}</span><span class="mono">quiz attempts</span></div><div><span class="big-n">${LIVE.users.filter(u=>u.app).length}</span><span class="mono">added the app</span></div><div><span class="big-n">${LIVE.users.filter(u=>u.progressViews).length}</span><span class="mono">checked progress</span></div></div>
   <h2 class="sec">Shared notes${LIVE.shares.length?` <span class="mono">(${LIVE.shares.length})</span>`:""}</h2>${LIVE.shares.length?`<ul class="sugg-list">${LIVE.shares.map(x=>`<li><div class="hd"><span><span class="sugg-cat">${esc(anySubj(x.subject)?.name||"Other")}</span> <b>${esc(x.title)}</b> <span class="muted">from ${esc(x.name||"Anonymous")}</span></span><span class="mono">${fmt(x.at)} <button class="btn small ghost" data-act="share-done" data-id="${esc(x.id)}">Done ✓</button></span></div>${x.message?`<div class="tx">${esc(x.message)}</div>`:""}<div><a class="btn small primary" href="${esc(x.link)}" target="_blank" rel="noopener noreferrer">Open link ↗</a> <span class="mono">${esc(x.link.replace(/^https?:\/\//,"").slice(0,60))}</span></div></li>`).join("")}</ul>`:`<p class="muted">No shared notes yet.</p>`}
   <h2 class="sec">Suggestions${LIVE.suggestions.length?` <span class="mono">(${LIVE.suggestions.length})</span>`:""}</h2>${LIVE.suggestions.length?`<ul class="sugg-list">${LIVE.suggestions.map(x=>`<li><div class="hd"><span><span class="sugg-cat">${esc(SUGG_CATS.find(c=>c[0]===x.category)?.[1]||"Other")}</span> <b>${esc(x.name||"Anonymous")}</b></span><span class="mono">${fmt(x.at)} <button class="btn small ghost" data-act="sugg-done" data-id="${esc(x.id)}">Done ✓</button></span></div><div class="tx">${esc(x.text)}</div></li>`).join("")}</ul>`:`<p class="muted">No suggestions yet.</p>`}
   <h2 class="sec">People</h2><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Name</th><th>Email</th><th class="n">Visits</th><th class="n">Downloads</th><th class="n">Quizzes</th><th>First visit</th><th>Last seen</th><th>Schedule</th></tr></thead><tbody>
   ${LIVE.users.map(u=>`<tr><td><span class="person">${u.photo?`<img src="${esc(u.photo)}" alt="" referrerpolicy="no-referrer">`:""}${esc(u.name||"—")}${u.app?`<span class="app-tag" title="Added to home screen ${esc(fmt(u.app))}">📲 App</span>`:""}${u.progressViews?`<span class="app-tag prog-tag" title="Opened My progress ${u.progressViews}× · last ${esc(fmt(u.progressAt))}">🔥 Progress ${u.progressViews}</span>`:""}${u.rolls?`<span class="app-tag lr-tag" title="Lucky Roll · ${(u.skins||[]).length||1} designs · using ${esc((lrSkin(u.skin)||lrSkin("default")).name)}">🎲 ${u.rolls}</span>`:""}</span></td><td>${esc(u.email||"")}</td><td class="n">${u.visits||0}</td><td class="n">${LIVE.dlog.filter(d=>d.uid===u.id).length}</td><td class="n">${LIVE.attempts.filter(a=>a.player===u.id).length}</td><td>${fmt(u.firstSeen)}</td><td>${fmt(u.lastSeen)}</td><td>${LIVE.editors.includes(u.id)?`<span class="editor-tag">Editor</span> <button class="btn small ghost" data-act="editor-off" data-id="${esc(u.id)}">Remove</button>`:`<button class="btn small" data-act="editor-on" data-id="${esc(u.id)}">Let them edit</button>`}</td></tr>`).join("")||`<tr><td colspan="7" class="muted">Nobody has signed in yet.</td></tr>`}
   </tbody></table></div>
   <h2 class="sec">Downloads by note</h2>${notesRows.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Note</th><th>Subject</th><th class="n">Downloads</th><th>Who</th></tr></thead><tbody>
   ${notesRows.map(r=>`<tr><td>${esc(r.title)}</td><td>${esc(r.subject)}</td><td class="n">${r.total}</td><td>${[...r.people.entries()].map(([uid,c])=>esc(nameOf(uid))+(c>1?` ×${c}`:"")).join(", ")}</td></tr>`).join("")}</tbody></table></div>`:`<p class="muted">No downloads yet.</p>`}
   <h2 class="sec">Latest downloads</h2>${LIVE.dlog.length?`<ul class="feed">${LIVE.dlog.slice(0,30).map(d=>`<li><span><b>${esc(d.name)}</b> downloaded ${esc(d.noteTitle)} <span class="muted">(${esc(d.subject)})</span></span><span class="mono">${fmt(d.at)}</span></li>`).join("")}</ul>`:`<p class="muted">No downloads yet.</p>`}`;
}
const tms=a=>a.at&&a.at.toMillis?a.at.toMillis():Date.now();
function ago(ms){const x=Math.max(0,(Date.now()-ms)/1000);if(x<60)return"just now";if(x<3600)return Math.floor(x/60)+" min ago";if(x<86400)return Math.floor(x/3600)+" h ago";return Math.floor(x/86400)+" d ago"}
function leaderboard(sid){const best=new Map();
  LIVE.attempts.filter(a=>a.subject===sid).forEach(a=>{const k=a.player||a.name,p=a.score/a.total,b=best.get(k);
    if(!b)best.set(k,{name:a.name,p,score:a.score,total:a.total,n:1});else{b.n++;if(p>b.p||(p===b.p&&a.total>b.total))Object.assign(b,{name:a.name,p,score:a.score,total:a.total})}});
  return[...best.values()].sort((x,y)=>y.p-x.p||y.total-x.total).slice(0,10)}
function feed(list,showSubj){return list.length?`<ul class="feed">${list.map(a=>`<li><span><b>${esc(a.name)}</b> scored ${a.score}/${a.total}${showSubj?` on ${esc(a.subjectName)}`:""}</span><span class="mono">${ago(tms(a))}</span></li>`).join("")}</ul>`:`<p class="muted">No attempts yet. Finish a quiz to be the first.</p>`}
function livePanel(sid){
  const err=LIVE.err?`<p class="muted">Live scores can't be reached right now.</p>`:"";
  if(!sid)return `<section class="live one"><div class="live-col"><h3><span class="dot"></span>Live activity</h3>${err||feed(LIVE.attempts.slice(0,8),true)}</div></section>`;
  const lb=leaderboard(sid),me=playerId();
  return `<section class="live"><div class="live-col"><h3><span class="dot"></span>Leaderboard</h3>${err||(lb.length?`<ol class="lb">${lb.map((r,i)=>`<li><span class="rank">${i+1}</span><span class="who">${esc(r.name)}</span><span class="mono">${Math.round(r.p*100)}% · ${r.score}/${r.total}</span></li>`).join("")}</ol>`:`<p class="muted">No scores yet. Be the first.</p>`)}</div>
    <div class="live-col"><h3>Recent attempts</h3>${err||feed(LIVE.attempts.filter(a=>a.subject===sid).slice(0,8),false)}</div></section>`}
function liveSlot(sid){return LIVE.on?`<div id="live-slot" data-sid="${esc(sid)}">${livePanel(sid)}</div>`:""}
function renderLive(){const el=document.getElementById("live-slot");if(el)el.innerHTML=livePanel(el.dataset.sid)}
setInterval(renderLive,60000);

(()=>{const b=document.createElement("button");b.className="suggest-fab";b.hidden=true;b.innerHTML='<span class="ic" aria-hidden="true">💡</span><span class="lbl">Suggestions</span>';b.setAttribute("aria-label","Send a suggestion");b.onclick=()=>openSuggest();document.body.appendChild(b);
  setInterval(()=>{b.hidden=!(LIVE.on&&LIVE.user)||!sheet.hidden},500)})();
/* Self-update: if the published page differs from the one this browser is showing (stale cache), reload once to get it. */
async function checkForUpdate(){try{
  const fresh=await fetch(location.pathname+"?check="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():"");
  if(!fresh||!SELF_JS||(fresh.includes(SELF_JS)&&fresh.includes(SELF_CSS)))return;
  const k="sa-upd-"+fresh.length;let done=null;try{done=sessionStorage.getItem(k)}catch(e){}
  if(done)return;try{sessionStorage.setItem(k,"1")}catch(e){}
  const u=new URL(location.href);u.searchParams.set("v",Date.now());location.replace(u.toString());
}catch(e){}}
if(location.protocol.startsWith("http")){setTimeout(checkForUpdate,1500);setInterval(checkForUpdate,10*60*1000)}
initLive();render();init();
})();
</script>
