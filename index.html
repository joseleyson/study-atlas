<html lang="en">

<meta property="og:description" content="Free med school review notes, topic PDFs, quizzes and a shared class schedule. Sign in with Google to start studying.">
<meta property="og:url" content="https://joseleyson.github.io/study-atlas/">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: an atlas of stained slides. Home is a grid of subject "slides"; a subject opens a two-pane reader (note index | note plate); quizzes run one question per screen. Subject colors are histology stains. */
:root{
  --bg:#f1f3f6; --surface:#ffffff; --ink:#141c25; --muted:#586574; --line:#d6dce4; --soft:#e7e9f3;
  --accent:#3f3796; --accent-ink:#ffffff; --good:#1d7a4c; --bad:#b3324c;
  --s-hema:#4b3a9c; --s-eosin:#c03f77; --s-lfb:#1f6db0; --s-silver:#98681c; --s-cresyl:#7c3a97; --s-safranin:#bd3a2b; --s-fast:#24876a;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1319; --surface:#161d25; --ink:#e5eaf0; --muted:#98a4b2; --line:#29333f; --soft:#20263a;
  --accent:#a8a1ff; --accent-ink:#15122f; --good:#56c58d; --bad:#f07c91;
  --s-hema:#9c8fff; --s-eosin:#f07fae; --s-lfb:#6ab2f0; --s-silver:#dba653; --s-cresyl:#c78ce2; --s-safranin:#f08470; --s-fast:#5ccfaa;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1319; --surface:#161d25; --ink:#e5eaf0; --muted:#98a4b2; --line:#29333f; --soft:#20263a;
  --accent:#a8a1ff; --accent-ink:#15122f; --good:#56c58d; --bad:#f07c91;
  --s-hema:#9c8fff; --s-eosin:#f07fae; --s-lfb:#6ab2f0; --s-silver:#dba653; --s-cresyl:#c78ce2; --s-safranin:#f08470; --s-fast:#5ccfaa;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1120px;margin:0 auto}
a{color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
.mono{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.04em;color:var(--muted)}
.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11.5px}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;
  padding:8px 16px;font-weight:500;font-size:14.5px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.btn.small{padding:5px 12px;font-size:13.5px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:20px 8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:19px;text-decoration:none}
.mark{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--s-eosin) 0 30%,transparent 31%),radial-gradient(circle at 65% 60%,var(--s-hema) 0 38%,transparent 39%),var(--soft);border:1.5px solid var(--ink)}
.back{text-decoration:none;color:var(--muted);font-weight:500}
.back:hover{color:var(--ink)}

/* home */
.hero{padding-block:28px 24px;display:grid;gap:8px}
.hero h1{font-size:clamp(30px,5vw,46px);font-weight:750;letter-spacing:-.02em}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.card{--c:var(--accent);position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s}
.card:hover{transform:translateY(-4px);border-color:var(--c);box-shadow:0 14px 30px -18px var(--c)}
.card-main{display:grid;gap:6px;text-decoration:none;padding:0 0 4px;flex:1}
.slide{height:128px;position:relative;overflow:hidden;background:color-mix(in srgb,var(--c) 10%,var(--surface));border-bottom:1px solid var(--line)}
.blob{position:absolute;right:18px;top:16px;width:96px;height:96px;border-radius:46% 54% 50% 50%/55% 45% 55% 45%;
  background:radial-gradient(circle at 30% 35%,color-mix(in srgb,var(--c) 85%,#000) 0 6%,transparent 7%),
    radial-gradient(circle at 62% 58%,color-mix(in srgb,var(--c) 85%,#000) 0 5%,transparent 6%),
    radial-gradient(circle at 45% 75%,color-mix(in srgb,var(--c) 85%,#000) 0 4%,transparent 5%),
    radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--c) 55%,var(--surface)) 0 60%,color-mix(in srgb,var(--c) 30%,var(--surface)) 61% 100%);
  transition:transform .4s ease}
.card:hover .blob{transform:rotate(18deg) scale(1.08)}
.card h2{font-size:22px;font-weight:700;padding:14px 18px 0}
.card p{margin:0;padding:0 18px;color:var(--muted);font-size:14.5px}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 18px 16px}
.card.add{align-items:center;justify-content:center;min-height:240px;border-style:dashed;background:transparent;cursor:pointer;color:var(--muted);font-weight:500;gap:8px}
.card.add:hover{color:var(--ink);border-color:var(--ink);box-shadow:none}
.plus{width:44px;height:44px;border-radius:50%;border:1.5px dashed currentColor;display:grid;place-items:center;font-size:24px;line-height:1}

/* subject */
.subj-head{--c:var(--accent);display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-block:18px 18px;border-bottom:3px solid var(--c)}
.subj-head h1{font-size:clamp(28px,4.5vw,40px);font-weight:750;letter-spacing:-.02em}
.subj-head p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.subj-head .eyebrow{color:var(--c)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;padding-block:14px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{background:var(--soft);color:var(--ink)}
.tab .n{font-family:var(--f-mono);font-size:12px;margin-left:4px}
.reader{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;align-items:start}
.index{position:sticky;top:12px;display:grid;gap:10px;min-width:0}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px}
.index ol{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-height:min(60vh,560px);overflow:auto}
.index li button{width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:8px 10px;cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:6px;align-items:baseline}
.index li button:hover{background:var(--soft)}
.index li button[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--c,var(--accent));font-weight:600}
.index .num{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.plate{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,3.5vw,36px);min-width:0}
.plate-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px}
.plate h2{font-size:clamp(24px,3.4vw,32px);font-weight:700;letter-spacing:-.01em}
.prose{max-width:68ch;overflow-wrap:anywhere}
.prose h3{font-size:20px;margin:26px 0 6px}
.prose h4{font-family:var(--f-body);font-size:16px;font-weight:600;margin:20px 0 4px}
.prose p{margin:0 0 12px}
.prose ul,.prose ol{margin:0 0 12px;padding-left:22px}
.prose li{margin:3px 0}
.prose li::marker{color:var(--c,var(--accent))}
.prose code{font-family:var(--f-mono);font-size:.88em;background:var(--soft);padding:1px 5px;border-radius:5px}
.prose blockquote{margin:14px 0;padding:10px 14px;border-left:3px solid var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 9%,var(--surface));border-radius:0 10px 10px 0}
.prose blockquote::before{content:"High-yield";display:block;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--c,var(--accent));margin-bottom:2px}
.prose blockquote p:last-child{margin:0}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:32px 22px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.empty h3{color:var(--ink);font-size:20px}

/* question bank */
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.qitem{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:start}
.qitem .qp{font-weight:500}
.qitem .qa{font-size:14px;color:var(--muted)}
.qitem .qa b{color:var(--good);font-weight:600}

/* quiz */
.quiz{max-width:760px;margin:0 auto;display:grid;gap:18px;padding-top:12px}
.progress{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--c,var(--accent));transition:width .3s ease}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,3.5vw,32px);display:grid;gap:16px}
.qcard h2{font-size:clamp(20px,3vw,25px);font-weight:650;letter-spacing:-.005em}
.choices{display:grid;gap:8px}
.choice{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice .k{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;background:var(--soft)}
.choice:disabled{cursor:default}
.choice.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.choice.right .k{background:var(--good);color:var(--surface)}
.choice.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.choice.wrong .k{background:var(--bad);color:var(--surface)}
.verdict{border-radius:12px;padding:12px 16px;background:var(--soft)}
.verdict strong{display:block;margin-bottom:2px}
.verdict.ok strong{color:var(--good)} .verdict.no strong{color:var(--bad)}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.score{display:grid;gap:4px;justify-items:center;text-align:center;padding-block:10px}
.score .big{font-family:var(--f-display);font-size:clamp(52px,10vw,84px);font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.missed{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.missed li{border-left:3px solid var(--bad);padding:6px 12px;background:var(--surface);border-radius:0 10px 10px 0}
.missed .ans{color:var(--good);font-weight:600}

/* sheet (editor) */
#sheet{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--ink) 40%,transparent);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#sheet[hidden]{display:none!important}
.sheet-panel{width:min(720px,100%);max-height:100%;overflow:auto;background:var(--surface);border-radius:18px;border:1px solid var(--line);padding:22px;display:grid;gap:14px}
.sheet-panel h2{font-size:22px}
.field{display:grid;gap:5px}
.field label,.field .lbl{font-weight:600;font-size:14px}
.field .hint{font-size:13px;color:var(--muted)}
.field input[type=text],.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px}
.field textarea{min-height:260px;resize:vertical;font-family:var(--f-mono);font-size:14px;line-height:1.55}
.field textarea.short{min-height:80px;font-family:var(--f-body);font-size:15px}
.chrow{display:grid;grid-template-columns:auto 26px 1fr;gap:8px;align-items:center}
.chrow .k{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{width:34px;height:34px;border-radius:50%;background:var(--c);cursor:pointer;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches input:checked+label{box-shadow:0 0 0 2px var(--ink)}
.swatches input:focus-visible+label{outline:2px solid var(--accent);outline-offset:3px}
.form-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:6px}
.form-foot .right{display:flex;gap:8px;margin-left:auto}
.err{color:var(--bad);font-size:14px;margin:0}

.notice{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--soft);font-size:14px;color:var(--muted)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:36px;padding-top:16px;border-top:1px solid var(--line)}
.tools .mono{margin-right:auto}
.live{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:22px}
.live.one{grid-template-columns:minmax(0,1fr)}
.live-col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.live-col h3{font-size:17px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.lb,.feed{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.lb li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line)}
.lb li:last-child,.feed li:last-child{border-bottom:0}
.lb .rank{font-family:var(--f-mono);color:var(--muted);font-size:13px}
.lb li:first-child .rank{color:var(--c,var(--accent));font-weight:600}
.lb .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.feed li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.feed li .mono{white-space:nowrap;font-size:12px}
.muted{color:var(--muted);margin:0;font-size:14.5px}
.qcard .field input{width:100%;max-width:340px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who-chip{display:flex;align-items:center;gap:8px}
.me{position:relative}
.me>summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;padding:3px 10px 3px 3px;border:1px solid transparent;border-radius:999px;user-select:none}
.me>summary::-webkit-details-marker{display:none}
.me>summary:hover,.me[open]>summary{border-color:var(--line);background:var(--surface)}
.me>summary .chev{font-size:11px;color:var(--muted);transition:transform .2s}
.me[open]>summary .chev{transform:rotate(180deg)}
.me .initial{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px}
.me-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:50;min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px -18px rgba(0,0,0,.35);padding:6px;display:grid;gap:2px;animation:menuin .16s ease-out}
@keyframes menuin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (max-width:860px){
  .me-menu{position:fixed;left:12px;right:12px;top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));min-width:0;max-height:80vh;overflow:auto;border-radius:20px;padding:8px;
    box-shadow:0 0 0 100vmax rgba(0,0,0,.45),0 20px 50px -20px rgba(0,0,0,.6);animation:sheetup .22s cubic-bezier(.2,.9,.3,1)}
  .me-menu::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line);margin:2px auto 8px}
  .me-menu .who{white-space:normal;overflow-wrap:anywhere}
  .me-menu a,.me-menu button{padding:13px 12px;font-size:16px}
  .me>summary .who-nm{max-width:12ch}
}
@keyframes sheetup{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.me-menu .who{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-menu .who b{display:block;color:var(--ink);font-size:14.5px}
.me-menu a,.me-menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:9px;border:0;background:none;font:inherit;font-size:14.5px;color:var(--ink);text-decoration:none;cursor:pointer}
.me-menu a:hover,.me-menu button:hover{background:var(--soft)}
.me-menu .heart{color:#e5484d}
.me-menu .sup{font-weight:600}
.support{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:28px;align-items:start;margin-top:8px}
.support .why{display:grid;gap:12px;color:var(--muted);max-width:56ch}
.support .why p{margin:0}
.support .why ul{margin:0;padding-left:20px;display:grid;gap:4px}
.qr-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;justify-items:center;text-align:center}
.qr-card img{width:100%;max-width:280px;border-radius:10px;background:#fff}
.qr-empty{width:100%;max-width:280px;aspect-ratio:1;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:14px;padding:20px}
.qr-card .thanks{font-weight:600;color:var(--ink)}
@media (max-width:720px){.support{grid-template-columns:1fr}.qr-card{order:-1}}
.online{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13.5px;font-weight:500;color:var(--ink);white-space:nowrap}

function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* tiny markdown: # ## ### headings, - bullets, 1. lists, > high-yield callouts, **bold**, *italic*, `code` */
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[\s(])\*(\S(?:.*?\S)?)\*/g,"$1<em>$2</em>").replace(/`(.+?)`/g,"<code>$1</code>")}
function md(src){
  const lines=String(src||"").replace(/\r/g,"").split("\n");let out="",list=null,para=[],quote=[];
  const flushP=()=>{if(para.length){out+=`<p>${inline(para.join(" "))}</p>`;para=[]}};
  const flushL=()=>{if(list){out+=`</${list}>`;list=null}};
  const flushQ=()=>{if(quote.length){out+=`<blockquote>${md(quote.join("\n"))}</blockquote>`;quote=[]}};
  for(const raw of lines){const l=raw.trimEnd();let m;
    if(/^>\s?/.test(l)){flushP();flushL();quote.push(l.replace(/^>\s?/,""));continue}else flushQ();
    if(!l.trim()){flushP();flushL();continue}
    if(m=l.match(/^(#{1,3})\s+(.*)/)){flushP();flushL();const t=["h3","h3","h4"][m[1].length-1];out+=`<${t}>${inline(m[2])}</${t}>`;continue}
    if(m=l.match(/^\s*[-*•]\s+(.*)/)){flushP();if(list!=="ul"){flushL();out+="<ul>";list="ul"}out+=`<li>${inline(m[1])}</li>`;continue}
    if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){flushP();if(list!=="ol"){flushL();out+="<ol>";list="ol"}out+=`<li>${inline(m[1])}</li>`;continue}
    flushL();para.push(l.trim());
  }
  flushP();flushL();flushQ();return out;
}

/* ---------- data ---------- */
async function write(fn,okMsg){
  try{await fn();if(okMsg)toast(okMsg);return true}
  catch(e){const c=e&&e.code;
    if(c==="quota_exceeded")toast("This browser's storage is full. Back up your notes, then delete a few old ones.");
    else toast("Couldn't save. This browser may be blocking site storage (private mode?).");
    return false}
}
/* Storage: site/data.js holds the main notes (window.STUDY_DATA). Edits made in the browser are kept
   as an overlay in this browser's localStorage, so updates to data.js still show up. */
const OVERLAY_KEY="study-atlas-edits-v1";
function loadOverlay(){if(true)return{up:{subjects:{},notes:{},questions:{}},del:{subjects:{},notes:{},questions:{}}};try{const o=JSON.parse(localStorage.getItem(OVERLAY_KEY)||"null");if(o&&o.up&&o.del)return o}catch(e){}return{up:{subjects:{},notes:{},questions:{}},del:{subjects:{},notes:{},questions:{}}}}
let OV=loadOverlay();
function saveOverlay(){localStorage.setItem(OVERLAY_KEY,JSON.stringify(OV))}
function merged(){const base=window.STUDY_DATA||{};const out={};
  ["subjects","notes","questions"].forEach(n=>{const m=new Map();(base[n]||[]).forEach(d=>m.set(d.id,d));
    Object.entries(OV.up[n]||{}).forEach(([id,d])=>m.set(id,{...d,id}));Object.keys(OV.del[n]||{}).forEach(id=>m.delete(id));out[n]=[...m.values()]});return out}
function refresh(){const m=merged();S.subjects=m.subjects;S.notes=m.notes;S.questions=m.questions;render()}
const col=n=>({doc:id=>({
  set:async data=>{OV.up[n][id]=data;delete OV.del[n][id];try{saveOverlay()}catch(e){delete OV.up[n][id];throw {code:"quota_exceeded"}}refresh()},
  delete:async()=>{delete OV.up[n][id];OV.del[n][id]=1;saveOverlay();refresh()}})});
function exportData(){const m=merged();const strip=a=>a.map(({...d})=>d);
  const txt="window.STUDY_DATA = "+JSON.stringify({subjects:strip(m.subjects),notes:strip(m.notes),questions:strip(m.questions)},null,2)+";\n";
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/javascript"}));
  a.download="data.js";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast("Saved data.js to your downloads")}
function importData(file){const r=new FileReader();r.onload=()=>{try{
    const t=String(r.result).replace(/^\s*window\.STUDY_DATA\s*=\s*/,"").replace(/;\s*$/,"");const d=JSON.parse(t);
    if(!d||!Array.isArray(d.subjects))throw 0;
    OV={up:{subjects:{},notes:{},questions:{}},del:{subjects:{},notes:{},questions:{}}};
    const base=window.STUDY_DATA||{};["subjects","notes","questions"].forEach(n=>{(base[n]||[]).forEach(x=>OV.del[n][x.id]=1);(d[n]||[]).forEach(x=>{const{id,...rest}=x;if(id){OV.up[n][id]=rest;delete OV.del[n][id]}})});
    saveOverlay();refresh();toast("Backup restored")}catch(e){toast("That file isn't a Study Atlas backup.")}};r.readAsText(file)}

async function init(){

/* ---------- routing ---------- */
function route(){const h=decodeURIComponent(location.hash.slice(1));
  if(h.startsWith("s-"))return{v:"subject",id:h.slice(2)};
  if(h.startsWith("q-"))return{v:"quiz",id:h.slice(2)};
  if(h.startsWith("d-"))return{v:"doc",id:h.slice(2)};
  if(h==="admin")return{v:"admin"};
  if(h==="new")return{v:"new"};
  if(h==="support")return{v:"support"};
  if(h==="schedule"||h.startsWith("schedule-"))return{v:"schedule",id:h.slice(9)};
  return{v:"home"}}

  return `<header class="top"><a class="brand" href="#"><span class="mark" aria-hidden="true"></span>Study Atlas</a><div class="top-right">${right}${srch}${grp}${th}${chip}</div></header>`}

const GREETS=["What are we reviewing today, {n}?","Ready to study, {n}?","Which topic is it today, {n}?","Let's get some reps in, {n}.","Brain warmed up, {n}?","One topic at a time, {n}.","What's on the review list, {n}?","Small steps, big grades, {n}.","Coffee ready? Let's go, {n}.","Time to make it stick, {n}.","Which notes are we opening, {n}?","You've got this, {n}. Pick a subject."];

function firstName(){const u=LIVE.user;const n=niceName((u&&(u.displayName||""))||"").trim().split(/\s+/)[0]||"";return n}
function helloLine(){const n=firstName();if(!n)return"";const h=new Date().getHours();
  const part=h<5?"Hi":h<12?"Good morning":h<18?"Good afternoon":"Good evening";
  return `<span class="hello">${part}, <span class="shine">${esc(n)}</span>.</span>`}
function greetText(){const n="",g=GREETS[GREET_I%GREETS.length];return n?g.replace("{n}",n):g.replace(/,? \{n\}/,"")}
function swapGreet(){const el=document.getElementById("greet");if(!el||document.hidden)return;GREET_I++;const next=greetText();
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!el.animate){el.textContent=next;return}
  const out=el.animate(still?[{opacity:1},{opacity:0}]:[{opacity:1,transform:"translateY(0)",filter:"blur(0)"},{opacity:0,transform:"translateY(-8px)",filter:"blur(4px)"}],{duration:600,easing:"ease-in",fill:"forwards"});
  out.onfinish=()=>{const cur=document.getElementById("greet");if(!cur)return;cur.textContent=next;
    cur.animate(still?[{opacity:0},{opacity:1}]:[{opacity:0,transform:"translateY(8px)",filter:"blur(4px)"},{opacity:1,transform:"translateY(0)",filter:"blur(0)"}],{duration:700,easing:"ease-out",fill:"forwards"});
    if(cur!==el)el.getAnimations().forEach(x=>x.cancel())}}
setInterval(swapGreet,GREET_MS);
function niceName(n){n=String(n||"");return n.includes("@")||/[A-Z]/.test(n)?n:n.replace(/(^|\s)\S/g,c=>c.toUpperCase())}

/* ---------- search ---------- */
function searchIndex(){const out=[];
  S.subjects.forEach(s=>out.push({k:"Subject",t:s.name,sub:s.blurb||"",href:"#s-"+s.id,c:stainVar(s.stain),txt:(s.name+" "+(s.blurb||"")).toLowerCase()}));
  ((window.STUDY_DATA||{}).docs||[]).forEach(d=>{const s=subj(d.subject);out.push({k:"Topic",t:d.title,sub:(s?s.name:"")+(d.desc?" · "+d.desc:""),href:"#d-"+d.id,c:stainVar(s?.stain),txt:(d.title+" "+(d.desc||"")+" "+(s?s.name:"")).toLowerCase()})});
  S.notes.forEach(n=>{const s=subj(n.subject);out.push({k:"Note",t:n.title,sub:s?s.name:"",href:"#s-"+n.subject,note:n.id,c:stainVar(s?.stain),txt:(n.title+" "+(s?s.name:"")).toLowerCase()})});
  return out}
function searchRows(q){q=q.trim().toLowerCase();const idx=searchIndex();
  const words=q.split(/\s+/).filter(Boolean);
  const hits=words.length?idx.filter(x=>words.every(w=>x.txt.includes(w))).sort((a,b)=>(b.t.toLowerCase().startsWith(words[0])-a.t.toLowerCase().startsWith(words[0]))||(a.k==="Topic"?-1:0)):idx.filter(x=>x.k!=="Note");
  return hits.slice(0,30)}
function paintSearch(q){const ul=document.getElementById("sx-list");if(!ul)return;const hits=searchRows(q);

function renderQuiz(id){
  const s=subj(id),back=topbar(`<a class="back" href="#s-${esc(id)}">← Back to notes</a>`);
  if(!s){app.innerHTML=back+`<div class="empty"><h3>This subject isn't here</h3><a class="btn" href="#">All subjects</a></div>`;return}
  const all=qsOf(id),c=stainVar(s.stain),Z=S.quiz;
  if(!Z||Z.subject!==id){
    const best=store("best-"+id);
    app.innerHTML=back+`<div class="quiz" style="--c:${c}"><div class="qcard"><span class="mono eyebrow" style="color:${c}">Quiz</span><h2 style="font-size:clamp(26px,4vw,34px)">${esc(s.name)}</h2>
      ${all.length?`<p style="margin:0;color:var(--muted)">${plural(all.length,"question")} in the bank, shuffled each time. Keys 1–5 pick an answer and Enter moves on.${best?` Your best so far is ${esc(best)}%.`:""}</p>

      :`<div class="coming"><svg viewBox="0 0 120 90" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--c,var(--accent))"><rect x="22" y="12" width="62" height="72" rx="8" opacity=".35"/><rect x="34" y="6" width="62" height="72" rx="8" fill="var(--surface)"/><path d="M46 26h30M46 38h22M46 50h26"/><circle cx="46" cy="62" r="3"/><path d="M54 62h18"/><path d="M88 58l14-14 6 6-14 14-8 2z" fill="var(--surface)"/></svg><h3>Quizzes coming soon</h3><p style="margin:0;color:var(--muted);max-width:42ch">Practice questions for this subject are being written. Check back after the next upload.</p></div><div style="text-align:center"><a class="btn" href="#s-${esc(id)}">Go to ${esc(s.name)}</a></div>`}</div>${liveSlot(id)}</div>`;
    return;
  }
  if(Z.i>=Z.items.length){
    const right=Z.items.filter(q=>q.picked===q.answer).length,pct=Math.round(right/Z.items.length*100);
    const prev=+store("best-"+id)||0;if(!Z.saved){Z.saved=1;Z.newBest=pct>prev&&Z.full;if(Z.newBest)store("best-"+id,String(pct));if(!Z.retry)postAttempt(id,right,Z.items.length)}
    const missed=Z.items.filter(q=>q.picked!==q.answer);
    app.innerHTML=back+`<div class="quiz" style="--c:${c}"><div class="qcard"><div class="score"><span class="mono eyebrow">${esc(s.name)} · result</span>
      <span class="big">${right}/${Z.items.length}</span><span class="mono">${pct}% correct${Z.newBest?" · new best":""}</span></div>
      ${missed.length?`<h3 style="font-size:18px">Review what you missed</h3><ul class="missed">${missed.map(q=>`<li><div>${esc(q.prompt)}</div><div class="ans">${esc(q.choices[q.answer])}</div>${q.explain?`<div class="mono" style="font-size:13px;letter-spacing:0">${esc(q.explain)}</div>`:""}</li>`).join("")}</ul>`:`<p style="text-align:center;margin:0">Perfect score. Nice work.</p>`}
      <div class="qnav">${missed.length?`<button class="btn primary" data-act="retry-missed">Retry the ${missed.length} missed</button>`:""}<button class="btn" data-act="start" data-n="${Z.items.length>=all.length?"all":Z.items.length}">New quiz</button><a class="btn ghost" href="#s-${esc(id)}">Back to notes</a></div></div>${liveSlot(id)}</div>`;
    return;
  }
  const q=Z.items[Z.i],done=q.picked!=null;
  app.innerHTML=back+`<div class="quiz" style="--c:${c}"><div class="qnav"><span class="mono">${esc(s.name)} · question ${Z.i+1} of ${Z.items.length}</span><span class="mono">${Z.items.filter(x=>x.picked===x.answer).length} correct</span></div>
    <div class="progress"><span style="width:${(Z.i+(done?1:0))/Z.items.length*100}%"></span></div>
    <div class="qcard"><h2>${esc(q.prompt)}</h2><div class="choices">${q.choices.map((ch,i)=>{
      let cls="";if(done){if(i===q.answer)cls="right";else if(i===q.picked)cls="wrong"}
      return `<button class="choice ${cls}" data-act="pick" data-i="${i}" ${done?"disabled":""}><span class="k">${L[i]}</span><span>${esc(ch)}</span></button>`}).join("")}</div>
    ${done?`<div class="verdict ${q.picked===q.answer?"ok":"no"}"><strong>${q.picked===q.answer?"Correct":"Not quite. The answer is "+L[q.answer]+"."}</strong>${q.explain?esc(q.explain):""}</div>`:""}
    <div class="qnav"><button class="btn ghost" data-act="quit">End quiz</button>${done?`<button class="btn primary" data-act="next" id="next-btn">${Z.i+1<Z.items.length?"Next question →":"See results"}</button>`:""}</div></div></div>`;
  if(done)document.getElementById("next-btn")?.focus();
}
function startQuiz(id,items,full,retry){
  S.quiz={subject:id,i:0,full,retry:!!retry,items:items.map(q=>{
    // shuffle choices but keep track of the right one
    const order=shuffle(q.choices.map((_,i)=>i).filter(i=>String(q.choices[i]||"").trim()));
    return{prompt:q.prompt,explain:q.explain,choices:order.map(i=>q.choices[i]),answer:order.indexOf(q.answer),picked:null,src:q}})};
  render();scrollTo(0,0);
}

let delHandler=null;

function editSubject(s){
  const st=s?.stain||STAINS[S.subjects.length%STAINS.length][0];
  delHandler=s?async()=>{const n=notesOf(s.id),q=qsOf(s.id);
    closeSheet();location.hash="";
    await write(async()=>{for(const x of n)await col("notes").doc(x.id).delete();for(const x of q)await col("questions").doc(x.id).delete();await col("subjects").doc(s.id).delete()},`Deleted ${s.name}`)}:null;
  openSheet(`<form id="f"><h2>${s?"Edit subject":"Add a subject"}</h2>
    <div class="field"><label for="f-name">Name</label><input type="text" id="f-name" required maxlength="60" value="${esc(s?.name||"")}" placeholder="e.g. Histology"></div>
    <div class="field"><label for="f-blurb">Short description</label><input type="text" id="f-blurb" maxlength="140" value="${esc(s?.blurb||"")}" placeholder="What this subject covers"></div>
    <div class="field"><span class="lbl">Stain color</span><div class="swatches">${STAINS.map(([k,n])=>`<input type="radio" name="stain" id="st-${k}" value="${k}" ${k===st?"checked":""}><label for="st-${k}" title="${n}" style="--c:var(--s-${k})"><span hidden>${n}</span></label>`).join("")}</div></div>
    ${foot(s?`Delete subject`:"")}</form>`,async f=>{
      const name=f.querySelector("#f-name").value.trim();if(!name)return formErr("Give the subject a name.");
      const data={name,blurb:f.querySelector("#f-blurb").value.trim(),stain:f.querySelector("input[name=stain]:checked").value,order:s?.order??Date.now()};
      const id=s?.id||slug(name);closeSheet();

    });
  if(s){const b=panel.querySelector("[data-act=del]");b.title=`Also deletes its ${plural(notesOf(s.id).length,"note")} and ${plural(qsOf(s.id).length,"question")}`}

function editNote(n,subjectId){
  delHandler=n?async()=>{closeSheet();S.noteId=null;await write(()=>col("notes").doc(n.id).delete(),"Note deleted")}:null;
  openSheet(`<form id="f"><h2>${n?"Edit note":"New note"}</h2>

    ${foot(n?"Delete note":"")}</form>`,async f=>{
      const title=f.querySelector("#f-title").value.trim();if(!title)return formErr("Give the note a title.");
      const id=n?.id||rid("n");const data={subject:n?.subject||subjectId,title,body:f.querySelector("#f-body").value,order:n?.order??Date.now(),updated:Date.now()};

function editQuestion(q,subjectId){
  delHandler=q?async()=>{closeSheet();await write(()=>col("questions").doc(q.id).delete(),"Question deleted")}:null;
  const ch=q?.choices||[];
  openSheet(`<form id="f"><h2>${q?"Edit question":"New question"}</h2>
    <div class="field"><label for="f-prompt">Question</label><textarea class="short" id="f-prompt" required>${esc(q?.prompt||"")}</textarea></div>
    <div class="field"><span class="lbl">Choices <span class="hint">· tick the correct one, leave extras blank</span></span>
    ${[0,1,2,3,4].map(i=>`<div class="chrow"><input type="radio" name="ans" id="ans-${i}" value="${i}" ${(q?q.answer===i:i===0)?"checked":""} aria-label="Choice ${L[i]} is correct"><label class="k" for="ans-${i}">${L[i]}</label><input type="text" id="ch-${i}" value="${esc(ch[i]||"")}" aria-label="Choice ${L[i]}"></div>`).join("")}</div>
    <div class="field"><label for="f-explain">Explanation <span class="hint">· shown after answering</span></label><textarea class="short" id="f-explain">${esc(q?.explain||"")}</textarea></div>
    ${foot(q?"Delete question":"")}</form>`,async f=>{
      const prompt=f.querySelector("#f-prompt").value.trim();if(!prompt)return formErr("Write the question first.");
      const raw=[0,1,2,3,4].map(i=>f.querySelector("#ch-"+i).value.trim());const pick=+f.querySelector("input[name=ans]:checked").value;
      if(!raw[pick])return formErr("The choice marked correct is blank.");
      const choices=[],map={};raw.forEach((c,i)=>{if(c){map[i]=choices.length;choices.push(c)}});
      if(choices.length<2)return formErr("Add at least two choices.");
      const id=q?.id||rid("q");const data={subject:q?.subject||subjectId,prompt,choices,answer:map[pick],explain:f.querySelector("#f-explain").value.trim(),order:q?.order??Date.now()};
      closeSheet();await write(()=>col("questions").doc(id).set(data),q?"Question saved":"Question added");
    });
}

  else if(a==="share-notes"){openShare()}
  else if(a==="share-done"){LIVE.fs.collection("shares").doc(id).delete().then(()=>toast("Marked as done")).catch(()=>toast("Couldn't remove it."))}
  else if(a==="sugg-done"){LIVE.fs.collection("suggestions").doc(id).delete().then(()=>toast("Marked as done")).catch(()=>toast("Couldn't remove it."))}
  else if(a==="ev-open"){openEvent(LIVE.events.find(x=>x.id===id))}
  else if(a==="ev-new"){editEvent(null,b.dataset.date||"")}
  else if(a==="editor-on"||a==="editor-off"){setEditor(id,a==="editor-on")}
  else if(a==="dl-doc"){popBurst(b,e);recordDocDownload(docById(id));{e.preventDefault();prepDownload(b.getAttribute("href"),b.getAttribute("download")||"notes.pdf")}}
  else if(a==="copy-site"){const url=location.href.split("#")[0];(navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast("Link copied. Paste it into your browser."),()=>{prompt("Copy this link:",url)})}
  else if(a==="sign-in"){const pr=new firebase.auth.GoogleAuthProvider();firebase.auth().signInWithPopup(pr).catch(e=>{if(e&&/popup-blocked|operation-not-supported/.test(e.code||""))firebase.auth().signInWithRedirect(pr);else if(e&&e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request"){const c=e.code||"";
    toast(c==="auth/unauthorized-domain"?"Sign-in isn't allowed on this web address yet. The site owner needs to add it in Firebase.":(c==="auth/configuration-not-found"||c==="auth/operation-not-allowed")?"Google sign-in isn't switched on yet. The site owner needs to enable it in Firebase.":c==="auth/network-request-failed"?"No connection. Check your internet and try again.":"Sign-in didn't work ("+c.replace("auth/","")+"). Try again.")}})}
  else if(a==="download")downloadNote(S.notes.find(n=>n.id===id));
  else if(a==="sign-out"){leavePresence();firebase.auth().signOut();location.hash=""}
});
addEventListener("keydown",e=>{

    const k=parseInt(e.key,10);if(q.picked==null&&k>=1&&k<=q.choices.length){q.picked=k-1;render()}

});

const mb=b=>b>=1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB";
function popBurst(el,ev){
  el.classList.remove("popping");void el.offsetWidth;el.classList.add("popping");
  const r=el.getBoundingClientRect(),x=ev&&ev.clientX?ev.clientX:r.left+r.width/2,y=ev&&ev.clientY?ev.clientY:r.top+r.height/2;
  const cols=["#e5484d","#f5a524","#22a861","#3e63dd","#8e4ec6","#e93d82"];
  const box=document.createElement("div");box.className="dl-burst";box.style.left=x+"px";box.style.top=y+"px";
  let h=`<span class="ring" style="--bc:${cols[3]}"></span>`;
  for(let i=0;i<14;i++){const ang=i/14*Math.PI*2+Math.random()*.4,dist=60+Math.random()*45;
    h+=`<span class="bit" style="--bc:${cols[i%cols.length]};--x:${Math.cos(ang)*dist}px;--y:${Math.sin(ang)*dist}px;--r:${Math.random()*540-270}deg;border-radius:${i%3?"3px":"50%"}"></span>`}
  h+=`<span class="plus" style="--bc:${cols[2]}">+1</span>`;
  box.innerHTML=h;document.body.appendChild(box);setTimeout(()=>box.remove(),1000)}

/* ---------- schedule ---------- */
const EV_TYPES=[["quiz","Quiz"],["exam","Exam"],["lecture","Lecture"],["deadline","Deadline"],["reminder","Reminder"],["other","Other"]];

const pad2=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const parseYmd=k=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};

const fmtTime=t=>{if(!t)return"";let[h,m]=t.split(":").map(Number);const ap=h>=12?"PM":"AM";h=h%12||12;return `${h}:${pad2(m)} ${ap}`};
/* multi-day events: optional endDate (YYYY-MM-DD, after date) */
const evEnd=e=>e.endDate&&e.endDate>e.date?e.endDate:e.date;
const evCovers=(e,k)=>e.date<=k&&k<=evEnd(e);
function evRange(e,long){const a=parseYmd(e.date),b=parseYmd(evEnd(e));const o=long?{weekday:"short",month:"short",day:"numeric"}:{month:"short",day:"numeric"};
  if(evEnd(e)===e.date)return a.toLocaleDateString(undefined,long?{weekday:"long",month:"long",day:"numeric"}:o);
  return a.getMonth()===b.getMonth()&&!long?`${a.toLocaleDateString(undefined,{month:"short"})} ${a.getDate()}–${b.getDate()}`:`${a.toLocaleDateString(undefined,o)} – ${b.toLocaleDateString(undefined,o)}`}
/* upcoming view: an event already running counts as "today" */
const evUpcoming=(today)=>LIVE.events.filter(e=>evEnd(e)>=today).map(e=>e.date<today?{...e,date:today,_ongoing:true}:e);
const evSort=(a,b)=>a.date.localeCompare(b.date)||(a.time||"99").localeCompare(b.time||"99")||a.title.localeCompare(b.title);
function evChip(e,withDay){const s=e.subject?anySubj(e.subject):null;
  return `<button class="ev ev-t t-${esc(e.type)}" data-act="ev-open" data-id="${esc(e.id)}"><span class="k">${esc(evLabel(e.type))}${e.time?" · "+esc(fmtTime(e.time)):""}</span><span class="ti">${esc(e.title)}</span>${withDay?`<span class="when">${esc(parseYmd(e.date).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}))}</span>`:evEnd(e)!==e.date?`<span class="when">${esc(evRange(e))}</span>`:""}${s?`<span class="su">${esc(s.name)}</span>`:""}</button>`}
function urgentChip(){if(!LIVE.on||!LIVE.user)return"";
  const now=new Date(),today=ymd(now),hm=pad2(now.getHours())+":"+pad2(now.getMinutes()),lim=ymd(addDays(now,14));
  const up=evUpcoming(today).filter(e=>(e.date>today||(e.date===today&&(e._ongoing||evEnd(e)>today||!e.time||e.time>=hm)))&&e.date<=lim).sort(evSort);
  const imp=x=>x.type==="exam"||x.type==="quiz"||x.type==="deadline";
  const first=up.find(imp)||up.find(x=>x.date<=ymd(addDays(now,2)));if(!first)return"";
  const same=up.filter(x=>x.date===first.date&&(imp(first)?imp(x):true));

    const when=multi?(e._ongoing?"until "+parseYmd(evEnd(e)).toLocaleDateString(undefined,{month:"short",day:"numeric"}):evRange(orig)):(d===0?"today":d===1?"tomorrow":parseYmd(e.date).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}))+(e.time?" "+fmtTime(e.time):"");
    return `<button class="urgent" data-act="ev-open" data-id="${esc(e.id)}"><span aria-hidden="true">⏰</span><span class="t">${esc(evLabel(e.type))}: ${esc(e.title)}</span><span class="when">${esc(when)}</span></button>`};

function comingUp(){if(!LIVE.on||!LIVE.user)return"";
  const now=new Date(),today=ymd(now),tmr=ymd(addDays(now,1)),end=ymd(addDays(now,7));
  const all=evUpcoming(today).filter(e=>e.date>=today&&e.date<=end).sort(evSort),cut=[...new Set(all.map(e=>e.date))].slice(0,3).pop()||today;

  const soon=e=>{if(e._ongoing)return"ongoing";if(e.type!=="exam"&&e.type!=="quiz"&&e.type!=="deadline")return"";const d=Math.round((parseYmd(e.date)-parseYmd(today))/864e5);return d<=1?"":`in ${d} days`};
  const groups=[];list.forEach(e=>{let g=groups.find(x=>x[0]===e.date);if(!g)groups.push(g=[e.date,[]]);g[1].push(e)});
  const body=groups.length?groups.map(([k,es])=>`<div class="un-group${k===tmr?" tmr":""}"><div class="un-day${k===today?" today":""}">${esc(dayLabel(k))}</div><div class="un-list">${es.map(e=>{const s=e.subject?anySubj(e.subject):null,sn=soon(e);
    return `<button class="un ev-t t-${esc(e.type)}" data-act="ev-open" data-id="${esc(e.id)}"><span class="un-dot" aria-hidden="true"></span><span class="bd"><span class="k">${esc(evLabel(e.type))}${evEnd(e)!==e.date||e._ongoing?" · "+esc(evRange(LIVE.events.find(x=>x.id===e.id)||e)):""}${e.time?" · "+esc(fmtTime(e.time)):""}${sn?`<span class="soon">${sn}</span>`:""}</span><span class="ti">${esc(e.title)}</span>${s?`<span class="su">${esc(s.name)}</span>`:""}</span></button>`}).join("")}</div></div>`).join("")
    :`<div class="upnext-empty"><span class="big" aria-hidden="true">🌿</span>Nothing due in the next 7 days.</div>`;

    <div class="upnext-foot"><a class="btn small" href="#schedule">Full schedule →</a>${canSchedule()?`<button class="btn small primary" data-act="ev-new">+ Add</button>`:""}</div></section>`}
function renderSchedule(startKey){

    ${canSchedule()?`<button class="btn primary small" data-act="ev-new">+ Add to schedule</button>`:""}</div>

function paintReacts(){document.querySelectorAll(".reacts[data-doc]").forEach(el=>{el.innerHTML=reactInner(el.dataset.doc)})}
function toggleReact(id,e){const u=LIVE.user;if(!u||!LIVE.fs||!REACTS.includes(e))return;
  const prev=LIVE.reacts.find(r=>r.doc===id&&r.uid===u.uid),cur=prev?.es||[],es=cur.includes(e)?cur.filter(x=>x!==e):[...cur,e];
  const rid=id+"__"+u.uid,ref=LIVE.fs.collection("reactions").doc(rid),name=(u.displayName||u.email||"").slice(0,80);
  LIVE.reacts=LIVE.reacts.filter(r=>r.id!==rid);if(es.length)LIVE.reacts.push({id:rid,doc:id,uid:u.uid,name,es});paintReacts();
  (es.length?ref.set({doc:id,uid:u.uid,name,es,at:firebase.firestore.FieldValue.serverTimestamp()}):ref.delete()).catch(()=>{
    LIVE.reacts=LIVE.reacts.filter(r=>r.id!==rid);if(prev)LIVE.reacts.push(prev);paintReacts();toast("Couldn't save your reaction. Try again in a bit.")})}
/* ---------- who's online ---------- */
const ONLINE_MS=2*60*1000,BEAT_MS=45*1000;let beatTimer=null,tickTimer=null;
function onlineCount(){const now=Date.now(),me=LIVE.user?.uid;
  const n=LIVE.presence.filter(p=>p.id!==me&&p.at&&now-p.at.toMillis()<ONLINE_MS).length;
  return n+(LIVE.user?1:0)}
function onlineLabel(){return `${onlineCount()} online`}
function paintOnline(){const el=document.getElementById("online-count");if(el)el.textContent=onlineLabel();
  const w=document.getElementById("who-list");if(w&&!sheet.hidden)w.innerHTML=whoRows()}
function onlineNow(){const now=Date.now(),me=LIVE.user?.uid;
  const list=LIVE.presence.filter(p=>p.id!==me&&p.at&&now-p.at.toMillis()<ONLINE_MS);
  if(LIVE.user)list.unshift({id:me,name:LIVE.user.displayName||LIVE.user.email||"You",at:{toMillis:()=>now},you:true});
  return list}
function whoRows(){const now=Date.now();return onlineNow().map(p=>{const s=Math.max(0,Math.round((now-p.at.toMillis())/1000));
  return `<li><span class="dot" aria-hidden="true"></span><span class="who-name">${esc(p.name||"Someone")}${p.you?' <span class="mono">(you)</span>':""}</span><span class="mono">${p.you||s<20?"active now":s<60?s+"s ago":Math.round(s/60)+" min ago"}</span></li>`}).join("")}
function openWho(){openSheet(`<h2>Online now</h2><p class="mono" style="margin:-4px 0 14px">Signed-in people active in the last 2 minutes. Only you can see this.</p>
  <ul class="who" id="who-list">${whoRows()}</ul><div class="form-foot"><div class="right"><button type="button" class="btn ghost" data-act="close">Close</button></div></div>`)}
document.addEventListener("click",e=>{if(e.target.closest("#who-online"))openWho();
  const g=e.target.closest("[data-g]");if(g){if(g.dataset.g==="search"){const t=g.querySelector(".sa-sx-txt"),qe=g.querySelector(".sa-sx-q");const q=t&&qe&&getComputedStyle(t).display!=="none"?qe.textContent.trim():"";openSearch();if(q)setTimeout(()=>{const i=document.getElementById("sx-q");if(i){i.value=q;i.focus();i.select();i.dispatchEvent(new Event("input",{bubbles:true}))}},0)}else if(g.dataset.g==="theme")toggleTheme()}
  const f=e.target.closest("[data-foot]");if(f){if(f.dataset.foot==="share")openShare();else openSuggest()}});
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&(e.key==="k"||e.key==="K")){if(LIVE.on&&!LIVE.user)return;e.preventDefault();if(sheet.hidden||!document.getElementById("sx-q"))openSearch();else document.getElementById("sx-q").focus()}});
function beat(){const u=LIVE.user;if(!u||document.visibilityState==="hidden")return;
  LIVE.fs.collection("presence").doc(u.uid).set({name:(u.displayName||u.email||"").slice(0,80),at:firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>{})}
function startPresence(u){stopPresence();beat();beatTimer=setInterval(beat,BEAT_MS);tickTimer=setInterval(paintOnline,15000);
  LIVE.unsubs.push(LIVE.fs.collection("presence").orderBy("at","desc").limit(300).onSnapshot(snap=>{
    LIVE.presence=snap.docs.map(d=>({id:d.id,...d.data({serverTimestamps:"estimate"})}));paintOnline()},()=>{}))}
function stopPresence(){clearInterval(beatTimer);clearInterval(tickTimer);beatTimer=tickTimer=null}
function leavePresence(){const u=LIVE.user;if(LIVE.on&&u)LIVE.fs.collection("presence").doc(u.uid).delete().catch(()=>{})}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")beat()});
addEventListener("pagehide",leavePresence);
async function recordVisit(u){
  const FV=firebase.firestore.FieldValue,ref=LIVE.fs.collection("users").doc(u.uid);
  const base={name:(u.displayName||"").slice(0,80),email:(u.email||"").slice(0,120),photo:(u.photoURL||"").slice(0,500),lastSeen:FV.serverTimestamp()};
  try{const d=await ref.get();
    if(d.exists)await ref.update({...base,visits:FV.increment(1)});else await ref.set({...base,firstSeen:FV.serverTimestamp(),visits:1});
  }catch(e){console.warn("visit not recorded",e)}}
function dlCount(id){return LIVE.downloads[id]||0}
async function downloadNote(n){if(!n)return;
  const FV=firebase.firestore.FieldValue,u=LIVE.user;
  try{await Promise.all([
    LIVE.fs.collection("downloads").doc(n.id).set({count:FV.increment(1)},{merge:true}),
    LIVE.fs.collection("downloadLog").add({uid:u.uid,name:(u.displayName||u.email||"").slice(0,80),noteId:n.id,noteTitle:String(n.title).slice(0,120),subject:String(subj(n.subject)?.name||"").slice(0,80),at:FV.serverTimestamp()})])}
  catch(e){console.warn("download not counted",e)}
  document.title=n.title+" · Study Atlas";setTimeout(()=>{window.print();setTimeout(()=>document.title="Study Atlas",500)},50);
}
function playerName(){const u=LIVE.user;return u?(u.displayName||u.email||"Someone").slice(0,30):""}
function playerId(){return LIVE.user?LIVE.user.uid:""}
async function postAttempt(sid,score,total){if(!LIVE.on||!LIVE.user)return;
  try{await LIVE.fs.collection("attempts").add({subject:sid,subjectName:(subj(sid)?.name||"").slice(0,80),name:playerName(),player:playerId(),score,total,at:firebase.firestore.FieldValue.serverTimestamp()})}
  catch(e){toast("Your score couldn't be shared. Check your connection.")}}
/* Messenger, Facebook, Instagram etc. open links in their own browser, where Google sign-in fails. */
const IN_APP=/FBAN|FBAV|FB_IAB|FBIOS|Messenger|Instagram|Line\/|MicroMessenger|TikTok|musical_ly|Snapchat|Twitter|; wv\)/i.test(navigator.userAgent||"");
const IS_ANDROID=/Android/i.test(navigator.userAgent||"");
function inAppNotice(){const url=location.href.split("#")[0];
  const chrome=IS_ANDROID?`<a class="btn primary" href="intent://${esc(url.replace(/^https?:\/\//,""))}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${encodeURIComponent(url)};end">Open in Chrome</a>`:"";
  return `<div class="inapp"><b>Open this in ${IS_ANDROID?"Chrome":"Safari"} to sign in</b>
    <p>Google sign-in doesn't work inside Messenger, Facebook or Instagram. ${IS_ANDROID?"Tap the button below, or tap ⋮ at the top and choose “Open in Chrome”.":"Tap ••• at the bottom (or top) of this screen and choose “Open in external browser” or “Open in Safari”."} You can also copy the link and paste it into ${IS_ANDROID?"Chrome":"Safari"}.</p>
    <div class="inapp-acts">${chrome}<button type="button" class="btn ${IS_ANDROID?"":"primary"}" data-act="copy-site">Copy link</button></div></div>`}
function renderSignIn(){
  app.innerHTML=topbar()+`<section class="signin"><div class="signin-card"><span class="mark big" aria-hidden="true"></span><h1>Study Atlas</h1>
    <p>Notes and quizzes for Neuroanatomy, Neurophysiology, Gross Anatomy and more. Sign in to open them.</p>
    ${IN_APP?inAppNotice():""}<button class="btn ${IN_APP?"ghost":"primary"}" data-act="sign-in"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Sign in with Google</button>
    <p class="fine">By signing in, your name, email and the notes you download are visible to the site owner. Your quiz scores show on the leaderboard under your Google name.</p></div></section>`;
}
function fmt(t){const ms=t&&t.toMillis?t.toMillis():0;return ms?new Date(ms).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"—"}
function renderAdmin(){
  const back=`<a class="back" href="#">← All subjects</a>`;
  if(!LIVE.isAdmin){app.innerHTML=topbar(back)+`<div class="empty" style="margin-top:30px"><h3>This page is for the site owner</h3><p>Your account ID is <code class="uid">${esc(LIVE.user?.uid||"")}</code></p></div>`;return}
  const byNote={};LIVE.dlog.forEach(d=>{(byNote[d.noteId]=byNote[d.noteId]||{title:d.noteTitle,subject:d.subject,people:new Map()});const p=byNote[d.noteId].people;p.set(d.uid,(p.get(d.uid)||0)+1)});
  const nameOf=uid=>{const u=LIVE.users.find(x=>x.id===uid);return u?(u.name||u.email):(LIVE.dlog.find(d=>d.uid===uid)?.name||"Someone")};
  const notesRows=Object.entries(byNote).map(([id,v])=>({id,...v,total:LIVE.downloads[id]||[...v.people.values()].reduce((a,b)=>a+b,0)})).sort((a,b)=>b.total-a.total);
  const totalDl=Object.values(LIVE.downloads).reduce((a,b)=>a+b,0);
  app.innerHTML=topbar(back)+`<section class="hero"><span class="mono eyebrow">Only you can see this page</span><h1>Who's visiting</h1></section>
   <p class="notice">Tap <b>Let them edit</b> next to a friend to let them add quizzes, exams and reminders to the Schedule. Only you can change who's an editor.</p>
   <div class="stats"><div><span class="big-n">${LIVE.users.length}</span><span class="mono">people signed in</span></div><div><span class="big-n">${LIVE.users.reduce((a,u)=>a+(u.visits||0),0)}</span><span class="mono">total visits</span></div><div><span class="big-n">${totalDl}</span><span class="mono">downloads</span></div><div><span class="big-n">${LIVE.attempts.length}</span><span class="mono">quiz attempts</span></div></div>
   <h2 class="sec">Shared notes${LIVE.shares.length?` <span class="mono">(${LIVE.shares.length})</span>`:""}</h2>${LIVE.shares.length?`<ul class="sugg-list">${LIVE.shares.map(x=>`<li><div class="hd"><span><span class="sugg-cat">${esc(anySubj(x.subject)?.name||"Other")}</span> <b>${esc(x.title)}</b> <span class="muted">from ${esc(x.name||"Anonymous")}</span></span><span class="mono">${fmt(x.at)} <button class="btn small ghost" data-act="share-done" data-id="${esc(x.id)}">Done ✓</button></span></div>${x.message?`<div class="tx">${esc(x.message)}</div>`:""}<div><a class="btn small primary" href="${esc(x.link)}" target="_blank" rel="noopener noreferrer">Open link ↗</a> <span class="mono">${esc(x.link.replace(/^https?:\/\//,"").slice(0,60))}</span></div></li>`).join("")}</ul>`:`<p class="muted">No shared notes yet.</p>`}
   <h2 class="sec">Suggestions${LIVE.suggestions.length?` <span class="mono">(${LIVE.suggestions.length})</span>`:""}</h2>${LIVE.suggestions.length?`<ul class="sugg-list">${LIVE.suggestions.map(x=>`<li><div class="hd"><span><span class="sugg-cat">${esc(SUGG_CATS.find(c=>c[0]===x.category)?.[1]||"Other")}</span> <b>${esc(x.name||"Anonymous")}</b></span><span class="mono">${fmt(x.at)} <button class="btn small ghost" data-act="sugg-done" data-id="${esc(x.id)}">Done ✓</button></span></div><div class="tx">${esc(x.text)}</div></li>`).join("")}</ul>`:`<p class="muted">No suggestions yet.</p>`}
   <h2 class="sec">People</h2><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Name</th><th>Email</th><th class="n">Visits</th><th class="n">Downloads</th><th class="n">Quizzes</th><th>First visit</th><th>Last seen</th><th>Schedule</th></tr></thead><tbody>
   ${LIVE.users.map(u=>`<tr><td><span class="person">${u.photo?`<img src="${esc(u.photo)}" alt="" referrerpolicy="no-referrer">`:""}${esc(u.name||"—")}</span></td><td>${esc(u.email||"")}</td><td class="n">${u.visits||0}</td><td class="n">${LIVE.dlog.filter(d=>d.uid===u.id).length}</td><td class="n">${LIVE.attempts.filter(a=>a.player===u.id).length}</td><td>${fmt(u.firstSeen)}</td><td>${fmt(u.lastSeen)}</td><td>${LIVE.editors.includes(u.id)?`<span class="editor-tag">Editor</span> <button class="btn small ghost" data-act="editor-off" data-id="${esc(u.id)}">Remove</button>`:`<button class="btn small" data-act="editor-on" data-id="${esc(u.id)}">Let them edit</button>`}</td></tr>`).join("")||`<tr><td colspan="7" class="muted">Nobody has signed in yet.</td></tr>`}
   </tbody></table></div>
   <h2 class="sec">Downloads by note</h2>${notesRows.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Note</th><th>Subject</th><th class="n">Downloads</th><th>Who</th></tr></thead><tbody>
   ${notesRows.map(r=>`<tr><td>${esc(r.title)}</td><td>${esc(r.subject)}</td><td class="n">${r.total}</td><td>${[...r.people.entries()].map(([uid,c])=>esc(nameOf(uid))+(c>1?` ×${c}`:"")).join(", ")}</td></tr>`).join("")}</tbody></table></div>`:`<p class="muted">No downloads yet.</p>`}
   <h2 class="sec">Latest downloads</h2>${LIVE.dlog.length?`<ul class="feed">${LIVE.dlog.slice(0,30).map(d=>`<li><span><b>${esc(d.name)}</b> downloaded ${esc(d.noteTitle)} <span class="muted">(${esc(d.subject)})</span></span><span class="mono">${fmt(d.at)}</span></li>`).join("")}</ul>`:`<p class="muted">No downloads yet.</p>`}`;
}
const tms=a=>a.at&&a.at.toMillis?a.at.toMillis():Date.now();
function ago(ms){const x=Math.max(0,(Date.now()-ms)/1000);if(x<60)return"just now";if(x<3600)return Math.floor(x/60)+" min ago";if(x<86400)return Math.floor(x/3600)+" h ago";return Math.floor(x/86400)+" d ago"}
function leaderboard(sid){const best=new Map();
  LIVE.attempts.filter(a=>a.subject===sid).forEach(a=>{const k=a.player||a.name,p=a.score/a.total,b=best.get(k);
    if(!b)best.set(k,{name:a.name,p,score:a.score,total:a.total,n:1});else{b.n++;if(p>b.p||(p===b.p&&a.total>b.total))Object.assign(b,{name:a.name,p,score:a.score,total:a.total})}});
  return[...best.values()].sort((x,y)=>y.p-x.p||y.total-x.total).slice(0,10)}
function feed(list,showSubj){return list.length?`<ul class="feed">${list.map(a=>`<li><span><b>${esc(a.name)}</b> scored ${a.score}/${a.total}${showSubj?` on ${esc(a.subjectName)}`:""}</span><span class="mono">${ago(tms(a))}</span></li>`).join("")}</ul>`:`<p class="muted">No attempts yet. Finish a quiz to be the first.</p>`}
function livePanel(sid){
  const err=LIVE.err?`<p class="muted">Live scores can't be reached right now.</p>`:"";
  if(!sid)return `<section class="live one"><div class="live-col"><h3><span class="dot"></span>Live activity</h3>${err||feed(LIVE.attempts.slice(0,8),true)}</div></section>`;
  const lb=leaderboard(sid),me=playerId();
  return `<section class="live"><div class="live-col"><h3><span class="dot"></span>Leaderboard</h3>${err||(lb.length?`<ol class="lb">${lb.map((r,i)=>`<li><span class="rank">${i+1}</span><span class="who">${esc(r.name)}</span><span class="mono">${Math.round(r.p*100)}% · ${r.score}/${r.total}</span></li>`).join("")}</ol>`:`<p class="muted">No scores yet. Be the first.</p>`)}</div>
    <div class="live-col"><h3>Recent attempts</h3>${err||feed(LIVE.attempts.filter(a=>a.subject===sid).slice(0,8),false)}</div></section>`}
function liveSlot(sid){return LIVE.on?`<div id="live-slot" data-sid="${esc(sid)}">${livePanel(sid)}</div>`:""}
function renderLive(){const el=document.getElementById("live-slot");if(el)el.innerHTML=livePanel(el.dataset.sid)}
setInterval(renderLive,60000);

(()=>{const b=document.createElement("button");b.className="suggest-fab";b.hidden=true;b.innerHTML='<span class="ic" aria-hidden="true">💡</span><span class="lbl">Suggestions</span>';b.setAttribute("aria-label","Send a suggestion");b.onclick=()=>openSuggest();document.body.appendChild(b);
  setInterval(()=>{b.hidden=!(LIVE.on&&LIVE.user)||!sheet.hidden},500)})();
/* Self-update: if the published page differs from the one this browser is showing (stale cache), reload once to get it. */
async function checkForUpdate(){try{
  const fresh=await fetch(location.pathname+"?check="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():"");
  if(!fresh||!SELF_JS||(fresh.includes(SELF_JS)&&fresh.includes(SELF_CSS)))return;
  const k="sa-upd-"+fresh.length;let done=null;try{done=sessionStorage.getItem(k)}catch(e){}
  if(done)return;try{sessionStorage.setItem(k,"1")}catch(e){}
  const u=new URL(location.href);u.searchParams.set("v",Date.now());location.replace(u.toString());
}catch(e){}}
if(location.protocol.startsWith("http")){setTimeout(checkForUpdate,1500);setInterval(checkForUpdate,10*60*1000)}
initLive();render();init();
})();
</script>
